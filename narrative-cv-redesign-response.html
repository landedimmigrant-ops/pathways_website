<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NCV — Structural Redesign Response</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #e7e6e1;
    --paper-2: #dedcd5;
    --card: #ffffff;
    --ink: #23231f;
    --ink-2: #55554e;
    --ink-3: #8b8a81;
    --line: #d4d3cc;
    --line-2: #e7e6e1;
    --fill: #f3f2ee;
    --fill-2: #ecebe6;
    --accent: oklch(0.49 0.072 256);      /* designer ink — critique voice + interactive affordance */
    --accent-soft: oklch(0.95 0.018 256);
    --accent-line: oklch(0.83 0.04 256);
    --approve: oklch(0.55 0.07 150);       /* product semantic: ✓ keep */
    --approve-soft: oklch(0.95 0.03 150);
    --flag: oklch(0.62 0.09 75);           /* product semantic: ✗ needs work */
    --flag-soft: oklch(0.95 0.04 80);
    --unsure: oklch(0.62 0.012 100);       /* product semantic: ? unsure */
    --unsure-soft: oklch(0.94 0.004 100);
    --r: 5px;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }

  /* ── Focus visibility (SGQRI/WCAG nod even in wireframe) ── */
  a:focus-visible, button:focus-visible, textarea:focus-visible,
  input:focus-visible, [tabindex]:focus-visible, summary:focus-visible {
    outline: 2.5px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .report { max-width: 1180px; margin: 0 auto; padding: 0 28px 140px; }

  /* ── Typographic scale ── */
  .kicker {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  h1, h2, h3, h4 { font-weight: 600; line-height: 1.18; margin: 0; letter-spacing: -0.01em; }
  .lede { font-size: 17px; line-height: 1.6; color: var(--ink-2); font-weight: 300; }
  .lede strong { font-weight: 600; color: var(--ink); }
  p { margin: 0 0 0.9em; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }

  /* ── Cover ── */
  .cover { padding: 92px 0 30px; border-bottom: 1px solid var(--line); }
  .cover h1 { font-size: clamp(30px, 4.4vw, 50px); max-width: 17ch; margin: 14px 0 22px; }
  .cover .lede { max-width: 64ch; }
  .cover-meta {
    display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 30px;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.02em;
  }
  .cover-meta b { color: var(--ink-2); font-weight: 600; }

  /* ── How to read ── */
  .howto {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 1px; background: var(--line); border: 1px solid var(--line);
    border-radius: var(--r); overflow: hidden; margin: 30px 0 8px;
  }
  .howto > div { background: var(--card); padding: 16px 18px; }
  .howto .kicker { margin-bottom: 7px; display: block; }
  .howto p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }

  /* ── Pain rail ── */
  .painwrap { margin: 14px 0 0; }
  .pain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .pain-cell { background: var(--card); padding: 15px 17px; }
  .pain-num { font-family: var(--mono); font-weight: 600; font-size: 12px; color: var(--flag); letter-spacing: 0.04em; }
  .pain-cell h4 { font-size: 14.5px; margin: 3px 0 5px; }
  .pain-cell p { font-size: 12.8px; line-height: 1.5; color: var(--ink-2); margin: 0; }

  /* ── Question section ── */
  .qsection { margin-top: 86px; scroll-margin-top: 20px; }
  .qhead { border-top: 2px solid var(--ink); padding-top: 18px; }
  .qhead .qno { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; color: var(--accent); font-weight: 600; }
  .qhead h2 { font-size: clamp(24px, 3vw, 34px); margin: 8px 0 14px; max-width: 22ch; }
  .qhead .lede { max-width: 70ch; font-size: 16px; }

  /* ── Diagnosis callout ── */
  .diagnosis {
    background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: var(--r); padding: 20px 22px; margin: 26px 0 8px;
  }
  .diagnosis .kicker { color: var(--accent); margin-bottom: 9px; display: block; }
  .diagnosis p { font-size: 14.5px; color: var(--ink-2); margin: 0 0 0.7em; }
  .diagnosis p:last-child { margin-bottom: 0; }
  .diagnosis strong { color: var(--ink); font-weight: 600; }

  /* ── Direction block ── */
  .direction { margin-top: 40px; }
  .dir-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .dir-tag {
    font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--card); background: var(--ink); padding: 3px 9px; border-radius: 3px; white-space: nowrap;
  }
  .dir-head h3 { font-size: 21px; }
  .dir-thesis { font-size: 15.5px; color: var(--ink-2); max-width: 76ch; margin: 8px 0 0; }
  .dir-thesis .lead-in { font-weight: 600; color: var(--ink); }

  .serves { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; align-items: center; }
  .serves-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-right: 2px; }

  /* ── Prototype frame ── */
  .frame {
    background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    margin-top: 16px; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  .frame-bar {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    background: var(--fill); border-bottom: 1px solid var(--line);
  }
  .frame-dots { display: flex; gap: 5px; }
  .frame-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
  .frame-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: var(--ink-3); }
  .frame-body { padding: 20px; }
  .frame-body.flush { padding: 0; }

  /* ── Wireframe primitives ── */
  .w-field { margin-bottom: 14px; }
  .w-field:last-child { margin-bottom: 0; }
  .w-flabel { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .w-flabel .nm { font-size: 13px; font-weight: 600; color: var(--ink); }
  .w-flabel .hint { font-size: 12px; color: var(--ink-3); font-weight: 400; }
  .w-opt { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; }
  textarea.w-ta, input.w-in {
    width: 100%; font-family: var(--sans); font-size: 13.5px; color: var(--ink);
    background: var(--fill); border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 11px; resize: vertical; line-height: 1.5;
  }
  textarea.w-ta::placeholder, input.w-in::placeholder { color: var(--ink-3); }
  textarea.w-ta:focus, input.w-in:focus { background: #fff; border-color: var(--accent); }
  textarea.w-ta.dashed { border-style: dashed; background: #fbfbf9; }

  .w-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 4px; padding: 8px 14px; transition: background .12s, border-color .12s;
  }
  .w-btn:hover { background: var(--fill); }
  .w-btn--primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .w-btn--primary:hover { background: #000; }
  .w-btn--ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 6px 4px; }
  .w-btn--ghost:hover { background: var(--accent-soft); }
  .w-btn--sm { font-size: 12px; padding: 5px 10px; }

  .w-hatch {
    background-image: repeating-linear-gradient(45deg, var(--fill-2) 0 7px, var(--card) 7px 14px);
    border: 1px dashed var(--line); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.04em;
    text-align: center; padding: 12px;
  }

  /* lint readout */
  .lint { margin-top: 8px; font-size: 12px; line-height: 1.5; }
  .lint-row { display: flex; gap: 7px; align-items: baseline; padding: 2px 0; }
  .lint-row .ic { font-family: var(--mono); font-weight: 600; flex: none; }
  .lint-flag .ic { color: var(--flag); }
  .lint-strength .ic { color: var(--approve); }
  .lint-flag { color: var(--ink-2); }
  .lint-strength { color: var(--ink-2); }
  .lint-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.03em; }
  .rubric { display: inline-flex; gap: 3px; vertical-align: middle; }
  .rubric i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
  .rubric i.on { background: var(--approve); }

  /* 3-way toggle */
  .t3 { display: inline-flex; gap: 6px; }
  .t3 button {
    width: 40px; height: 40px; border-radius: 5px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; font-size: 16px; color: var(--ink-2);
    display: grid; place-items: center; transition: all .12s; font-family: var(--sans);
  }
  .t3 button:hover { background: var(--fill); }
  .t3 button.on-keep { background: var(--approve); border-color: var(--approve); color: #fff; }
  .t3 button.on-work { background: var(--flag); border-color: var(--flag); color: #fff; }
  .t3 button.on-uns { background: var(--unsure); border-color: var(--unsure); color: #fff; }

  /* chips / tags */
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono);
    font-size: 10.5px; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-2); background: var(--card); white-space: nowrap;
  }
  .chip--pain { color: var(--flag); border-color: var(--flag-soft); background: var(--flag-soft); cursor: help; font-weight: 600; }
  .chip--rule { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  .chip--trust { color: var(--approve); border-color: var(--approve-soft); background: var(--approve-soft); }

  /* margin pin annotations */
  .pin {
    display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start;
    background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r);
    padding: 12px 14px; margin-top: 12px; font-size: 13px; color: var(--ink-2); line-height: 1.5;
  }
  .pin .pn {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
    font-family: var(--mono); font-size: 11px; font-weight: 600; display: grid; place-items: center; margin-top: 1px;
  }
  .pin b { color: var(--ink); font-weight: 600; }

  .tradeoff {
    margin-top: 12px; font-size: 13px; color: var(--ink-2); display: grid;
    grid-template-columns: 18px 1fr; gap: 9px; align-items: start;
  }
  .tradeoff .ic { color: var(--flag); font-family: var(--mono); font-weight: 600; }
  .tradeoff b { color: var(--ink); }

  /* generic layout helpers */
  .row { display: flex; gap: 12px; }
  .between { justify-content: space-between; align-items: center; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .stack-sm > * + * { margin-top: 8px; }
  .divider { height: 1px; background: var(--line-2); margin: 16px 0; border: 0; }

  /* in-prototype sidebar / TOC mock */
  .mini-toc { width: 192px; flex: none; border-right: 1px solid var(--line); padding-right: 16px; }
  .mini-toc-item { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 4px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .mini-toc-item:hover { background: var(--fill); }
  .mini-toc-item.active { background: var(--fill-2); color: var(--ink); font-weight: 600; }
  .mini-dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
  .mini-dot.done { background: var(--approve); border-color: var(--approve); }
  .mini-dot.active { border-color: var(--ink); }

  /* nav anchor */
  .toc-strip {
    position: sticky; top: 0; z-index: 50; background: var(--paper);
    border-bottom: 1px solid var(--line); display: flex; gap: 4px; align-items: center;
    padding: 9px 28px; margin: 0 -28px 0; font-family: var(--mono); font-size: 11.5px;
  }
  .toc-strip a { color: var(--ink-2); text-decoration: none; padding: 5px 10px; border-radius: 4px; letter-spacing: 0.03em; }
  .toc-strip a:hover { background: var(--fill); color: var(--ink); }
  .toc-strip .brand { font-weight: 600; color: var(--ink); margin-right: auto; letter-spacing: 0.04em; }

  /* synthesis */
  .synth { margin-top: 96px; background: var(--ink); color: #eceae3; border-radius: 9px; padding: 40px 38px; }
  .synth .kicker { color: #b9b7ad; display: block; margin-bottom: 12px; }
  .synth h2 { color: #fff; font-size: clamp(24px, 3vw, 32px); max-width: 24ch; margin-bottom: 18px; }
  .synth p { color: #c9c7be; font-size: 15px; max-width: 74ch; }
  .synth strong { color: #fff; font-weight: 600; }
  .synth-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px; background: #3a3a35; border: 1px solid #3a3a35; border-radius: var(--r); overflow: hidden; margin-top: 26px; }
  .synth-cell { background: #2b2b27; padding: 18px; }
  .synth-cell .qn { font-family: var(--mono); font-size: 11px; color: #8f8d84; letter-spacing: 0.08em; }
  .synth-cell h4 { color: #fff; font-size: 15px; margin: 6px 0 7px; }
  .synth-cell p { color: #b6b4ab; font-size: 13px; margin: 0; }

  .footnote { margin-top: 30px; font-size: 12.5px; color: var(--ink-3); font-family: var(--mono); letter-spacing: 0.02em; }

  /* ── Teammate verdict callout (integrating Prem's review comments) ── */
  .verdict { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: var(--fill); border: 1px solid var(--line); border-left: 3px solid var(--ink); border-radius: var(--r); padding: 12px 14px; margin-top: 12px; }
  .verdict.love { border-left-color: var(--approve); }
  .verdict.push { border-left-color: var(--flag); }
  .verdict.open { border-left-color: var(--accent); }
  .verdict .v-who { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #fff; background: var(--ink); padding: 3px 8px; border-radius: 3px; }
  .verdict .v-quote { font-size: 13px; color: var(--ink); font-style: italic; line-height: 1.5; }
  .verdict .v-resp { font-size: 13px; color: var(--ink-2); margin-top: 8px; line-height: 1.55; }
  .verdict .v-resp b { color: var(--ink); font-weight: 600; }
  .verdict .v-resp .lead { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.07em; color: var(--accent); margin-right: 7px; text-transform: uppercase; font-weight: 600; }

  /* ── Capstone: the flow, in motion ── */
  .flow-rail { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 0; margin-bottom: 20px; }
  .flow-step-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 5px; font-family: var(--sans); }
  .flow-step-btn:disabled { cursor: default; opacity: 0.55; }
  .flow-num { width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: none; transition: all 0.2s; }
  .flow-num.done { background: var(--approve); border-color: var(--approve); color: #fff; }
  .flow-num.active { border-color: var(--ink); color: var(--ink); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
  .flow-step-label { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .flow-step-label.active { color: var(--ink); font-weight: 600; }
  .flow-connector { width: 22px; height: 1.5px; background: var(--line); flex: none; }
  .flow-connector.done { background: var(--approve); }
  .flow-stage { position: relative; min-height: 430px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; }
  .flow-panel { padding: 28px 30px; flex: 1; }
  .flow-panel.fwd { animation: flowInFwd 0.34s cubic-bezier(.2,.7,.3,1); }
  .flow-panel.back { animation: flowInBack 0.34s cubic-bezier(.2,.7,.3,1); }
  @keyframes flowInFwd { from { transform: translateX(7px); } to { transform: none; } }
  @keyframes flowInBack { from { transform: translateX(-7px); } to { transform: none; } }
  .flow-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .flow-panel h3 { font-size: 23px; margin: 7px 0 5px; }
  .flow-lead { font-size: 14px; color: var(--ink-2); max-width: 62ch; margin: 0 0 18px; line-height: 1.55; }
  .flow-reveal { animation: flowReveal 0.3s ease; }
  @keyframes flowReveal { from { transform: translateY(-6px); } to { transform: none; } }
  .flow-nav { display: flex; align-items: center; justify-content: space-between; padding: 13px 30px; border-top: 1px solid var(--line-2); background: var(--fill); }
  .flow-pin { border: 1px dashed var(--line); border-radius: 7px; padding: 11px 13px; background: #fbfbf9; margin-bottom: 16px; }
  .flow-pin .lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
  .flow-funder { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .flow-review-block { border: 1px solid var(--line); border-radius: 7px; padding: 14px 16px; margin-bottom: 12px; background: #fff; }
  .flow-review-block h5 { font-size: 13px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .flow-review-field { padding: 7px 0; border-top: 1px solid var(--line-2); }
  .flow-review-field:first-of-type { border-top: none; }
  .flow-review-field .fk { font-size: 11px; font-weight: 600; color: var(--ink-3); font-family: var(--mono); letter-spacing: 0.03em; }
  .flow-review-field .fv { font-size: 13px; color: var(--ink); line-height: 1.5; margin-top: 2px; }
  .flow-review-field .fv.empty { color: var(--ink-3); font-style: italic; }

  @media (max-width: 720px) {
    .report { padding: 0 16px 90px; }
    .mini-toc { display: none; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
  /* NCV lint engine — inlined (LLM-free, deterministic). Ported from the
     current prototype's Phase-F detectors. Five Tier-1 rules + 0–4 rubric. */
  (function () {
    "use strict";
    const FIELD_LABELS = { activities: "Activities", outputs: "Outputs", outcomes: "Outcomes", evidence: "Evidence", impact: "Impact", freeform: "Contribution" };
    const LENGTH_RANGES = { activities: [40, 80], outputs: [30, 60], outcomes: [50, 100], evidence: [30, 80], impact: [40, 100], freeform: [80, 220] };
    const WE_RX = /\b(we|us|our|ours)\b/gi;
    const WEAK_VERB_RX = /\b(involved in|participated in|contributed to|was part of|helped|assisted with)\b/i;
    const OWNERSHIP_RX = /\bI\s+(led|designed|developed|built|created|ran|directed|established|founded|authored|invented|discovered|formulated|devised|initiated|spearheaded|conceived|drove|delivered|produced|wrote|analy[sz]ed|modeled|modelled|supervised|co-?designed|pioneered)\b/i;
    const NUM_RX = /\b\d[\d,.]*\b/g;
    const CURRENCY_RX = /[$€£]\s?\d|\b\d[\d,.]*\s?(million|billion|k|m|%|percent)\b/gi;
    const YEAR_RX = /\b(19|20)\d{2}\b/g;
    const VAGUE_WORDS = ["various", "widely cited", "well-received", "well received", "high-impact", "high impact", "numerous", "significant", "substantial", "cutting-edge", "cutting edge", "world-class", "world class", "leading", "innovative", "impactful", "important", "groundbreaking", "ground-breaking", "renowned"];
    const HEDGE_RX = /\b(may|might|could|possibly|potentially|perhaps|likely|hopefully|seems to|appears to|arguably|presumably)\b/gi;
    const RULES = [
      { id: "T1.first-person-ownership", label: "First-person ownership", pain: 1, detect(text) {
          const flags = [], strengths = [];
          const we = (text.match(WE_RX) || []).length;
          const hasOwnership = OWNERSHIP_RX.test(text);
          const weak = text.match(WEAK_VERB_RX);
          if (we > 0) flags.push(`${we}× we/us/our — the reviewer assesses you, not the team. Name your own role.`);
          if (weak) flags.push(`Weak verb "${weak[0]}" — be explicit about what YOU did.`);
          if (hasOwnership) strengths.push("Ownership marker present (I + action verb).");
          return { flags, strengths, rubricPoint: hasOwnership && we === 0 };
      } },
      { id: "T1.specificity", label: "Specificity", pain: 2, detect(text) {
          const nums = (text.match(NUM_RX) || []).length;
          const currency = (text.match(CURRENCY_RX) || []).length;
          const years = (text.match(YEAR_RX) || []).length;
          const total = nums + currency;
          if (total === 0 && years === 0) return { flags: [], strengths: [], rubricPoint: false };
          const parts = [];
          if (total > 0) parts.push(`${total} specific number${total === 1 ? "" : "s"}`);
          if (years > 0) parts.push(`${years} dated reference${years === 1 ? "" : "s"}`);
          return { flags: [], strengths: [parts.join(", ") + "."], rubricPoint: true };
      } },
      { id: "T1.vague-language", label: "Vague language", pain: 2, detect(text) {
          const lower = " " + text.toLowerCase() + " ";
          const out = [], seen = new Set();
          VAGUE_WORDS.forEach((w) => {
            if (lower.includes(" " + w + " ") || lower.includes(" " + w + ",") || lower.includes(" " + w + ".")) {
              const msg = `Vague: "${w}" — what concretely makes it so? Reviewers read this as weakness.`;
              if (!seen.has(msg)) { seen.add(msg); out.push(msg); }
            }
          });
          return { flags: out, strengths: [], rubricPoint: out.length === 0 && text.trim().length > 0 };
      } },
      { id: "T1.hedging-field-aware", label: "Hedging (field-aware)", pain: 3, detect(text, field) {
          const found = text.match(HEDGE_RX) || [];
          const hasHedging = found.length > 0;
          if (field === "impact") return { flags: [], strengths: hasHedging ? [`Hedging used appropriately for Impact (${found.length}×) — reviewers expect it here.`] : [], rubricPoint: hasHedging };
          if (!hasHedging) return { flags: [], strengths: [], rubricPoint: true };
          const lead = field === "outcomes"
            ? `Hedging in Outcomes ("${found[0]}") — Outcomes are what already changed. If hypothesised, move it to Impact.`
            : `Hedging "${found[0]}" — state it definitively. Save the "might/could" for Impact.`;
          return { flags: [lead], strengths: [], rubricPoint: false };
      } },
      { id: "T1.length-completeness", label: "Length / completeness", pain: 0, detect(text, field) {
          const wc = (text.trim().match(/\S+/g) || []).length;
          const [min, max] = LENGTH_RANGES[field] || [40, 100];
          const flags = []; let status = "ok";
          if (wc === 0) status = "empty";
          else if (wc < min * 0.5) { status = "too-short"; flags.push(`Very short (${wc} words; aim ${min}–${max}).`); }
          else if (wc < min) { status = "short"; flags.push(`A little short (${wc} words; aim ${min}–${max}).`); }
          else if (wc > max * 1.5) { status = "long"; flags.push(`Long (${wc} words; aim ${min}–${max}) — consider trimming.`); }
          return { flags, strengths: [], rubricPoint: false, wordCount: wc, range: [min, max], status };
      } },
    ];
    function analyseField(text, field) {
      const t = text || "";
      const results = RULES.map((r) => Object.assign({ id: r.id, label: r.label, pain: r.pain }, r.detect(t, field)));
      const flags = [], strengths = [];
      results.forEach((r) => {
        (r.flags || []).forEach((f) => flags.push({ id: r.id, pain: r.pain, text: f }));
        (r.strengths || []).forEach((s) => strengths.push({ id: r.id, pain: r.pain, text: s }));
      });
      let rubric = 0;
      results.forEach((r) => { if (r.id !== "T1.length-completeness" && r.rubricPoint) rubric++; });
      const lengthRes = results.find((r) => r.id === "T1.length-completeness") || {};

function RubricDots({ rubric, max = 4 }) {

/* compact lint readout used across Q3/Q4 */
function LintReadout({ analysis, showRubric = true, max = 4 }) {

/* auto-growing wireframe textarea */
function WireTA({ value, onChange, placeholder, minRows = 3, dashed, id, ariaLabel }) {
  const ref = useRef(null);
  useEffect(() => {
    const ta = ref.current;
    if (!ta) return;
    ta.style.height = "auto";
    ta.style.height = Math.max(ta.scrollHeight, minRows * 22 + 22) + "px";

      id={id}
      aria-label={ariaLabel}

      value={value}
      placeholder={placeholder}
      rows={minRows}
      onChange={(e) => onChange(e.target.value)}

  );
}

/* ──────────────────────────────────────────────────────────────────────────
   Q3 — Is the five-field bundle the right granularity?
   Directions: Freeform-first / Progressive disclosure / Guided Outcome–Impact split.
   ────────────────────────────────────────────────────────────────────────── */
const { useState: useStateQ3, useMemo: useMemoQ3 } = React;

/* lightweight coverage heuristics (LLM-free, illustrative) */
const COVERAGE = [
  { key: "activities", label: "Activities + your role", test: (t) => /\bI\s+(led|designed|built|developed|ran|directed|created|supervised|co-?designed|analy[sz]ed)\b/i.test(t) },
  { key: "outputs", label: "Named outputs", test: (t) => /\b(paper|papers|dataset|code|toolbox|toolkit|method|patent|partnership|model|film|report|instrument|framework)\b/i.test(t) },
  { key: "outcomes", label: "Something already changed", test: (t) => /\b(adopted|used by|in use|deployed|cited in|informed|changed|now run|now used|standard)\b/i.test(t) },
  { key: "evidence", label: "Evidence of uptake", test: (t) => /(\d|\bcited\b|\breplicat|\bdownload|\bendorsed|\bmedia|\bcoverage)/i.test(t) },
  { key: "impact", label: "Hypothesised systemic impact", test: (t) => /\b(if adopted|could|might|at scale|systemic|sector|population|national|nationally)\b/i.test(t) },
];

/* ░░ 3A — FREEFORM FIRST ░░ */
/* deterministic per-sentence field suggestion — same cue families the lint uses, no LLM */
function suggestField(s) {
  if (/\b(could|might|if adopted|if expanded|at scale|systemic|nationally|sector|population)\b/i.test(s)) return "impact";
  if (/(\d|\bcited\b|\breplicat|\bdownload|\bendorsed|\bmedia|\bcoverage|\bcitation)/i.test(s)) return "evidence";
  if (/\b(paper|papers|dataset|code|toolbox|toolkit|method|patent|partnership|report|instrument|framework|film)\b/i.test(s)) return "outputs";
  if (/\b(adopted|used by|in use|deployed|cited in|informed|now run|now used|standard|pilot)\b/i.test(s)) return "outcomes";
  return "activities";
}
function FreeformDirection() {
  const [text, setText] = useStateQ3("");
  const [structured, setStructured] = useStateQ3(false);
  const [target, setTarget] = useStateQ3("activities");
  const [filed, setFiled] = useStateQ3({}); // sentenceIdx -> fieldKey
  const cover = useMemoQ3(() => COVERAGE.map((c) => ({ ...c, hit: c.test(text) })), [text]);
  const hits = cover.filter((c) => c.hit).length;
  const sentences = useMemoQ3(() => splitSentences(text), [text]);
  const reset = () => { setText(""); setStructured(false); setFiled({}); };

  return (
    <Frame title="freeform-first.html · write the contribution as one thought; structure it after">
      <SampleBar note="Round 1 = one box, no taxonomy. Try:"
        onLoad={(k) => { setText(k === "messy" ? "I led a six-person team building an anomaly-detection model for aging bridges. We published a paper and filed a patent in 2023. It is now in pilot with two provincial ministries and caught two failures traditional inspection missed. If adopted federally it could shift inspection from periodic to continuous." : SAMPLE_BUNDLES.engineering.activities + " " + SAMPLE_BUNDLES.engineering.outputs + " " + SAMPLE_BUNDLES.engineering.outcomes + " " + SAMPLE_BUNDLES.engineering.evidence); setStructured(false); setFiled({}); }}
        onClear={reset} />

      <div className="w-field">
        <div className="w-flabel"><span className="nm">Tell the story of this contribution</span><span className="hint">however it comes out — we’ll help you shape it next</span></div>
        <WireTA value={text} onChange={setText} minRows={5} placeholder="One theme of your work. What you did, what came of it, why it matters. Don’t worry about structure yet." />
      </div>

      {!structured && (
        <div style={{ marginTop: 6 }}>
          <div className="lint-meta" style={{ marginBottom: 8 }}>WHAT YOUR DRAFT ALREADY COVERS — {hits}/5 (a hint, not a gate)</div>
          <div className="row wrap" style={{ gap: 6 }}>
            {cover.map((c) => (
              <span key={c.key} className="chip" style={{ color: c.hit ? "var(--approve)" : "var(--ink-3)", borderColor: c.hit ? "var(--approve-soft)" : "var(--line)", background: c.hit ? "var(--approve-soft)" : "var(--card)" }}>
                {c.hit ? "✓" : "○"} {c.label}
              </span>
            ))}
          </div>
          <button className="w-btn w-btn--sm" type="button" style={{ marginTop: 14 }} disabled={!text.trim()} onClick={() => setStructured(true)}>Shape this into the five fields →</button>
        </div>
      )}

      {structured && (
        <div style={{ marginTop: 10 }}>
          <div style={{ padding: "10px 12px", background: "var(--accent-soft)", border: "1px solid var(--accent-line)", borderRadius: 6, fontSize: 12.5, color: "var(--ink-2)", marginBottom: 12 }}>
            <b style={{ color: "var(--ink)" }}>No language model.</b> We split your draft into sentences and suggest a home for each using the same deterministic cues the lint engine already runs (numbers → Evidence, “I led…” → Activities, “could / if adopted” → Impact). <b style={{ color: "var(--ink)" }}>You</b> file them — pick a field, tap a sentence — or accept all the suggestions at once. Every call is yours to override.
          </div>

          <div className="row wrap" style={{ gap: 6, marginBottom: 6, alignItems: "center" }}>
            <span className="lint-meta" style={{ marginRight: 2 }}>FILE INTO →</span>
            {FIELD_DEFS.map((d) => {
              const n = Object.values(filed).filter((v) => v === d.key).length;
              return (
                <button key={d.key} type="button" className={"w-btn w-btn--sm" + (target === d.key ? " w-btn--primary" : "")} onClick={() => setTarget(d.key)}>
                  {d.label}{n > 0 ? " · " + n : ""}
                </button>
              );
            })}
          </div>
          <div className="row wrap" style={{ gap: 8, marginBottom: 12 }}>
            <button className="w-btn w-btn--sm" type="button" onClick={() => { const f = {}; sentences.forEach((s, i) => (f[i] = suggestField(s))); setFiled(f); }}>Accept all rule suggestions</button>
            <button className="w-btn w-btn--sm w-btn--ghost" type="button" onClick={() => setFiled({})}>Empty all fields</button>
          </div>

          {/* unfiled pool */}
          {sentences.some((_, i) => !filed[i]) && (
            <div style={{ marginBottom: 12 }}>
              <div className="lint-meta" style={{ marginBottom: 6 }}>YOUR SENTENCES — tap to file into <b>{FIELD_DEFS.find((d) => d.key === target).label}</b> (or use its suggestion)</div>
              <div className="stack-sm">
                {sentences.map((s, i) => filed[i] ? null : (
                  <div key={i} className="row between" style={{ gap: 8, padding: "7px 9px", border: "1px solid var(--line)", borderRadius: 5, background: "var(--fill)" }}>
                    <span style={{ fontSize: 12.5, color: "var(--ink-2)" }}>{s}</span>
                    <span className="row" style={{ gap: 6, flex: "none", alignItems: "center" }}>
                      <span className="lint-meta" title="deterministic suggestion">→ {FIELD_DEFS.find((d) => d.key === suggestField(s)).label}</span>
                      <button className="w-btn w-btn--sm" type="button" onClick={() => setFiled((f) => ({ ...f, [i]: target }))}>file</button>
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* the five fields, now populated */}
          <div className="stack-sm">
            {FIELD_DEFS.map((d) => {
              const mine = sentences.map((s, i) => ({ s, i })).filter(({ i }) => filed[i] === d.key);
              return (
                <div key={d.key} style={{ border: "1px solid var(--line)", borderRadius: 6, padding: "9px 11px", background: mine.length ? "#fff" : "#fbfbf9" }}>
                  <div className="row between"><span style={{ fontSize: 12.5, fontWeight: 600 }}>{d.label}{d.societal && <span className="chip" style={{ fontSize: 9, padding: "0 5px", marginLeft: 6 }}>fully societal</span>}</span><span className="lint-meta">{d.hint}</span></div>
                  {mine.length === 0 ? <div className="lint-meta" style={{ fontStyle: "italic", marginTop: 4 }}>empty — file a sentence here, or leave it (you can skip)</div>
                    : <div style={{ marginTop: 6 }}>{mine.map(({ s, i }) => (
                        <div key={i} onClick={() => setFiled((f) => { const c = { ...f }; delete c[i]; return c; })} title="tap to send back to the pool"
                          style={{ cursor: "pointer", fontSize: 12.5, padding: "6px 8px", background: "var(--fill)", border: "1px solid var(--line)", borderRadius: 4, marginBottom: 5, color: "var(--ink)" }}>{s}</div>
                      ))}</div>}
                </div>
              );
            })}
          </div>
          <button className="w-btn w-btn--sm w-btn--ghost" type="button" style={{ marginTop: 8 }} onClick={() => setStructured(false)}>← back to one box</button>
        </div>
      )}
    </Frame>
  );
}

/* ░░ 3B — PROGRESSIVE DISCLOSURE ░░ */
function ProgressiveDirection() {
  const [vals, setVals] = useStateQ3({});
  const supporting = ["outputs", "evidence", "impact"]; // revealed after the core pair, in order
  const [revealed, setRevealed] = useStateQ3(0);
  const shownKeys = ["activities", "outcomes"].concat(supporting.slice(0, revealed));
  const canonical = ["activities", "outputs", "outcomes", "evidence", "impact"];
  const visible = canonical.filter((k) => shownKeys.includes(k));
  const nextKey = supporting[revealed];
  const nextDef = nextKey ? FIELD_DEFS.find((f) => f.key === nextKey) : null;

  return (
    <Frame title="progressive.html · all five fields — introduced in steps, not all at once">
      <div className="lint-meta" style={{ marginBottom: 12 }}>The bundle still wants <b>all five fields</b> — this only changes how many you face at one time. You start with the two that carry the contribution (<b>what you did</b>, <b>what changed</b>), then bring in the supporting three one step at a time.</div>
      <div className="stack-sm">
        {visible.map((k) => {
          const d = FIELD_DEFS.find((f) => f.key === k);
          const isNew = k === supporting[revealed - 1];
          return (
            <div key={k} className={isNew ? "flow-reveal" : ""}>
              <WireField def={d} value={vals[k] || ""} onChange={(v) => setVals((s) => ({ ...s, [k]: v }))} showLint minRows={2} />
            </div>
          );
        })}
      </div>
      <div className="row between wrap" style={{ gap: 8, marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--line-2)", alignItems: "center" }}>
        <span className="lint-meta">{revealed + 2} of 5 fields in view</span>
        {nextDef
          ? <button className="w-btn w-btn--sm w-btn--primary" type="button" onClick={() => setRevealed((r) => r + 1)}>Continue — add {nextDef.label} →</button>
          : <span className="chip chip--trust">✓ Full five-field bundle, reached in steps</span>}
      </div>
    </Frame>
  );
}

/* ░░ 3C — GUIDED OUTCOME / IMPACT SPLIT ░░ */
function splitSentences(t) {
  return (t || "").split(/(?<=[.!?])\s+/).map((s) => s.trim()).filter((s) => s.length > 3);
}
function SplitDirection() {
  const [text, setText] = useStateQ3("");
  const [sorting, setSorting] = useStateQ3(false);
  const [assign, setAssign] = useStateQ3({}); // idx -> 'out' | 'imp'
  const sentences = useMemoQ3(() => splitSentences(text), [text]);
  const suggest = (s) => /\b(may|might|could|if|would|potentially|hypothesi|at scale|systemic|nationally)\b/i.test(s) ? "imp" : "out";

  const outcomes = sentences.map((s, i) => ({ s, i })).filter(({ i }) => assign[i] === "out");
  const impact = sentences.map((s, i) => ({ s, i })).filter(({ i }) => assign[i] === "imp");
  const unsorted = sentences.map((s, i) => ({ s, i })).filter(({ i }) => !assign[i]);

  return (
    <Frame title="guided-split.html · one field while drafting; split already-happened from could-happen after">
      <SampleBar note="Drafting: one field. The hardest conceptual move (Pain #3) is deferred to a guided pass. Try:"

/* ░░ 4C — ON-DEMAND UNDERLINES ░░ */
const WE_WORDS = ["we", "us", "our", "ours"];
const VAGUE_SET = ["various", "widely", "well-received", "high-impact", "numerous", "significant", "substantial", "leading", "innovative", "impactful", "important", "renowned"];
const HEDGE_SET = ["may", "might", "could", "possibly", "potentially", "perhaps", "likely", "arguably"];
function markup(text) {
  // tokenise into words + whitespace, tag flagged words
  const parts = (text || "").split(/(\s+)/);
  return parts.map((tok) => {
    const bare = tok.toLowerCase().replace(/[^a-z\-]/g, "");
    if (WE_WORDS.includes(bare)) return { tok, flag: { rule: "T1.first-person-ownership", pain: 1, note: "Collective voice. The reviewer assesses you — name your own role." } };
    if (VAGUE_SET.includes(bare)) return { tok, flag: { rule: "T1.vague-language", pain: 2, note: "Vague to a reviewer. What concretely makes it so? Numbers, names, dates." } };
    if (HEDGE_SET.includes(bare)) return { tok, flag: { rule: "T1.hedging-field-aware", pain: 3, note: "Hedging. Outside the Impact field, state it definitively." } };
    return { tok };
  });
}
function OnDemandDirection() {
  const [text, setText] = useStateQ4("");
  const [revealed, setRevealed] = useStateQ4(false);
  const [active, setActive] = useStateQ4(null);
  const marked = useMemoQ4(() => markup(text), [text]);
  const flagCount = marked.filter((m) => m.flag).length;
  return (
    <Frame title="on-demand.html · invisible until invited — the quietest the lint can be">
      <SampleBar note="The lint never shows itself uninvited. You write in peace, then ask. Try:"
        onLoad={(k) => { setText(k === "messy" ? SAMPLE_BUNDLES.sociology.activities + " " + SAMPLE_BUNDLES.sociology.evidence : SAMPLE_BUNDLES.engineering.activities); setRevealed(false); setActive(null); }}
        onClear={() => { setText(""); setRevealed(false); setActive(null); }} />
      <div className="w-field">
        <div className="w-flabel"><span className="nm">Your contribution</span><span className="hint">write freely — no marks, no scores</span></div>
        <WireTA value={text} onChange={(v) => { setText(v); setRevealed(false); }} minRows={4} placeholder="Write without anything watching. When you want a second pair of eyes, ask for one." />
      </div>
      <div className="row between wrap" style={{ marginBottom: 10 }}>
        <button className="w-btn w-btn--sm" type="button" disabled={!text.trim()} onClick={() => setRevealed((r) => !r)}>
          {revealed ? "Hide the marks" : "→ Show me what a reviewer would flag"}
        </button>
        {revealed && <span className="lint-meta">{flagCount} phrase{flagCount === 1 ? "" : "s"} worth a look · tap any underline</span>}
      </div>
      {revealed && (
        <div style={{ padding: "12px 14px", border: "1px solid var(--line)", borderRadius: 7, background: "#fff", fontSize: 14, lineHeight: 1.7, position: "relative" }}>
          {marked.map((m, i) =>
            m.flag ? (
              <span key={i} onClick={() => setActive(active === i ? null : i)} title={m.flag.rule}
                style={{ textDecorationLine: "underline", textDecorationStyle: "dotted", textDecorationColor: m.flag.pain === 1 ? "var(--flag)" : "var(--accent)", textUnderlineOffset: 3, cursor: "pointer", background: active === i ? "var(--accent-soft)" : "transparent", borderRadius: 2 }}>{m.tok}</span>
            ) : <span key={i}>{m.tok}</span>
          )}
          {active != null && marked[active] && marked[active].flag && (
            <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid var(--line-2)" }}>
              <div className="row" style={{ gap: 6, marginBottom: 5 }}><PainTag n={marked[active].flag.pain} /><RuleTag id={marked[active].flag.rule} /></div>
              <div style={{ fontSize: 13, color: "var(--ink-2)" }}>{marked[active].flag.note}</div>
            </div>
          )}
          {flagCount === 0 && <span className="lint-meta" style={{ fontStyle: "italic" }}> — nothing flagged. Clean draft.</span>}
        </div>
      )}
    </Frame>
  );
}

        <div><Kicker>The blue voice</Kicker><p>Anything in <span style={{ color: "var(--accent)", fontWeight: 600 }}>blue</span> is the designer talking — critique, rationale, tradeoffs. Greyscale chrome is the prototype.</p></div>
        <div><Kicker>Pain tags</Kicker><p>Moves are tied to your six researcher pain points. <PainTag n={1} /> means “this serves pain point #1.” Hover for the detail.</p></div>
        <div><Kicker>Mix &amp; match</Kicker><p>Directions are atomic, not packages. The synthesis proposes one combined shape — and <a href="#flow" style={{ color: "var(--accent)" }}>the flow, in motion</a> walks it end-to-end.</p></div>
        <div><Kicker>Your comments</Kicker><p>This pass answers your review notes directly — look for the <span style={{ fontFamily: "var(--mono)", fontSize: 11, fontWeight: 600, color: "#fff", background: "var(--ink)", padding: "1px 6px", borderRadius: 3 }}>PREM</span> callouts under each direction.</p></div>
      </div>
      <div className="cover-meta">
        <span><b>Scope:</b> Q1 flow · Q3 fields · Q4 feedback</span>
        <span><b>State shown:</b> empty / first-touch</span>
        <span><b>Fidelity:</b> mid-fi wireframe</span>
        <span><b>Not in scope:</b> visual polish, Q2 (round split)</span>
      </div>
    </header>
  );
}

function PainRail() {
  return (
    <section className="painwrap" aria-label="researcher pain points">
      <div style={{ margin: "30px 0 12px" }}>
        <Kicker>The load-bearing structure · six researcher pain points (§4)</Kicker>
        <p className="muted" style={{ fontSize: 14, margin: "6px 0 0", maxWidth: "72ch" }}>Every design move is measured against these. A redesign that loses purchase on any one loses purchase on the task. They’re the rubric for the rubric.</p>
      </div>
      <div className="pain-grid">
        {PAIN_POINTS.map((p) => (
          <div key={p.n} className="pain-cell">
            <span className="pain-num">PAIN #{p.n}</span>
            <h4>{p.title}</h4>
            <p>{p.short}</p>
            <p style={{ marginTop: 6, fontFamily: "var(--mono)", fontSize: 10.5, color: "var(--ink-3)", letterSpacing: "0.02em" }}>{p.who}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

function Direction({ dir }) {
  const C = dir.Component;
  return (
    <article className="direction">
      <div className="dir-head">
        <span className="dir-tag">{dir.tag}</span>
        <h3>{dir.name}</h3>
      </div>
      <p className="dir-thesis">{dir.thesis}</p>
      <Serves pains={dir.pains} />
      <C />
      {dir.pins && dir.pins.map((p) => <Pin key={p.n} n={p.n}>{p.body}</Pin>)}
      {dir.tradeoff && <Tradeoff>{dir.tradeoff}</Tradeoff>}
      {dir.verdict && <Verdict tone={dir.verdict.tone} quote={dir.verdict.quote}>{dir.verdict.resp}</Verdict>}
    </article>
  );
}

function QuestionSection({ q, id }) {
  const D = q.Diagnosis;
  return (
    <section className="qsection" id={id}>
      <div className="qhead">
        <span className="qno">{q.qno}</span>
        <h2>{q.title}</h2>
        <p className="lede">{q.lede}</p>
      </div>
      <div className="diagnosis">
        <Kicker>Diagnosis — the current shape</Kicker>
        <D />
      </div>
      {q.directions.map((dir) => <Direction key={dir.tag} dir={dir} />)}
    </section>
  );
}

function Synthesis() {
  return (
    <section className="synth" id="synthesis">
      <Kicker>If you only take one thing</Kicker>
      <h2>One coherent shape — assembled from the strongest parts</h2>
      <p>
        The three questions aren’t independent. The flow, the fields, and the feedback all answer one underlying question: <strong>how do we keep a defended researcher in flow long enough to find their voice?</strong> Your review pushed this toward a focused, step-by-step experience — assembled and walkable in <a href="#flow" style={{ color: "#fff", textDecorationColor: "#7e7c73" }}>the flow, in motion</a>.
      </p>
      <div className="synth-grid">
        <div className="synth-cell">
          <span className="qn">Q1 · FLOW</span>
          <h4>Kept order, one space at a time, PS bookended</h4>
          <p>Not the long-scroll canvas (parked, per your note). A focused panel flow in your recommended order (1B), with a north-star sketch up front and the statement refined at the end (1C). All-access shows up only at <em>review</em>.</p>
        </div>
        <div className="synth-cell">
          <span className="qn">Q3 · FIELDS</span>
          <h4>All five fields, introduced in steps</h4>
          <p>The bundle still wants all five — you just meet them two at a time, not on a blank page (3B). The Outcome/Impact cut becomes a guided, LLM-free sentence sort (3C / 3A). The taxonomy is a strengthening lens, not a wall.</p>
        </div>
        <div className="synth-cell">
          <span className="qn">Q4 · FEEDBACK</span>
          <h4>Quiet by default, advisor on request</h4>
          <p>Lint stays on-demand while drafting (4C) so flow is sacred. “Advisor’s read” (4B) is the deliberate evaluation pass — and the literal mode Eli or Holly sits in beside a researcher.</p>
        </div>
      </div>
      <p style={{ marginTop: 26 }}>
        What this protects: the five-field <em>pedagogy</em> and the Outcome/Impact <em>distinction</em> (your hard-won Phase C work) survive intact — they just stop being the <em>first</em> thing a frightened writer meets. The hard break of Round 2 (Q2, which you set aside) becomes less necessary once feedback is continuous-but-optional. And the trust property — <TrustTag>nothing leaves your device</TrustTag> — gets a permanent home at the hub level, where it belongs.
      </p>
      <p style={{ marginTop: 14, color: "#8f8d84", fontSize: 13.5 }}>
        Honest read: the current tool will <em>work</em> — it’s thoughtfully built. The risk isn’t that it fails; it’s that the defended researcher closes the tab in the first ninety seconds, before any of the good pedagogy gets a chance to land. Every move above is aimed at those ninety seconds.
      </p>
    </section>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   CAPSTONE — "The flow, in motion"  (responds to Prem's main ask:
   a focused, one-space-at-a-time experience that advances bit by bit, keeps
   the recommended order, builds toward the Personal Statement, and ends in an
   all-access review so nobody jumps around.)
   ════════════════════════════════════════════════════════════════════════ */
const FLOW_STEPS = ["Orientation", "Compass", "Contribution", "Statement", "Review"];
function FlowInMotion() {
  const [step, setStep] = React.useState(0);
  const [dir, setDir] = React.useState("fwd");
  const [maxReached, setMaxReached] = React.useState(0);
  const [data, setData] = React.useState({ funder: "", compass: "", activities: "", outcomes: "", outputs: "", evidence: "", impact: "", whyMine: "" });
  const [reveal, setReveal] = React.useState(0); // supporting fields revealed in the contribution panel
  const set = (k, v) => setData((d) => ({ ...d, [k]: v }));
  const supporting = ["outputs", "evidence", "impact"];

  const go = (n) => { if (n < 0 || n > FLOW_STEPS.length - 1) return; setDir(n >= step ? "fwd" : "back"); setStep(n); setMaxReached((m) => Math.max(m, n)); };
  const fieldDef = (k) => FIELD_DEFS.find((f) => f.key === k);

  const rail = (
    <div className="flow-rail">
      {FLOW_STEPS.map((label, i) => (
        <React.Fragment key={i}>
          {i > 0 && <span className={"flow-connector" + (i <= maxReached ? " done" : "")}></span>}
          <button className="flow-step-btn" type="button" disabled={i > maxReached} onClick={() => go(i)}>
            <span className={"flow-num" + (i < step ? " done" : i === step ? " active" : "")}>{i < step ? "✓" : i + 1}</span>
            <span className={"flow-step-label" + (i === step ? " active" : "")}>{label}</span>
          </button>
        </React.Fragment>
      ))}
    </div>
  );

  let panel = null;
  if (step === 0) {
    panel = (
      <div>
        <span className="flow-kicker">Step 1 · Orientation</span>
        <h3>Let’s build your Narrative CV</h3>
        <p className="flow-lead">A Narrative CV tells the story of your research — what you did, what changed because of it, and what it could change next. It’s a different kind of writing, and most researchers find it unfamiliar. That’s normal. We’ll take it one calm step at a time, in an order that makes the hardest part — the personal statement — easier when you reach it.</p>
        <div className="flow-pin">
          <div className="lbl">Which application is this for?</div>
          <div className="flow-funder">
            {[["tcv", "Tri-agency CV (TCV)"], ["cv-frq", "CV-FRQ (FRQ)"], ["", "Not sure yet"]].map(([k, label]) => (
              <button key={label} type="button" className={"w-btn w-btn--sm" + (data.funder === k && (k || data.funder === "") ? "" : "")} style={{ borderColor: data.funder === k ? "var(--accent)" : "var(--line)", background: data.funder === k ? "var(--accent-soft)" : "#fff" }} onClick={() => set("funder", k)}>{label}</button>
            ))}
          </div>
          <div className="lint-meta">You can change this anytime — it only adjusts wording later, never the structure.</div>
        </div>
        <TrustTag>Everything stays on this device — nothing is uploaded</TrustTag>
      </div>
    );
  } else if (step === 1) {
    panel = (
      <div>
        <span className="flow-kicker">Step 2 · Your compass</span>
        <h3>Before the hard part — one line</h3>
        <p className="flow-lead">Don’t write your personal statement yet. Just leave yourself a compass: one rough sentence on why your area matters. No scaffold, no scoring. You’ll come back and sharpen this at the very end, once your contributions have surfaced the real story.</p>
        <div className="w-field">
          <div className="w-flabel"><span className="nm">Why does your area matter?</span><span className="hint">a rough line is plenty</span></div>
          <WireTA value={data.compass} onChange={(v) => set("compass", v)} minRows={2} placeholder="Hearing loss affects 1 in 5 adults over 60 and predicts cognitive decline, yet its neural basis is poorly understood…" />
        </div>
        <div className="lint-meta">This single line is the seed of your personal statement. Planting it now means the blank page at the end is never actually blank.</div>
      </div>
    );
  } else if (step === 2) {
    const nextKey = supporting[reveal];
    const nextDef = nextKey ? fieldDef(nextKey) : null;
    const visible = ["activities", "outcomes"].concat(supporting.slice(0, reveal));
    const canonical = ["activities", "outputs", "outcomes", "evidence", "impact"];
    panel = (
      <div>
        <span className="flow-kicker">Step 3 · A contribution</span>
        <h3>Your first contribution</h3>
        <p className="flow-lead">Two fields to start — what you did, and what changed. We’ll bring in the supporting three one at a time, so you’re never staring at five empty boxes. The full bundle is still the goal; this is just a gentler way in.</p>
        {data.compass && (
          <div className="flow-pin"><div className="lbl">Your compass (kept in view)</div><div style={{ fontSize: 12.5, color: "var(--ink-2)", fontStyle: "italic" }}>{data.compass}</div></div>
        )}
        <div className="stack-sm">
          {canonical.filter((k) => visible.includes(k)).map((k) => {
            const isNew = k === supporting[reveal - 1];
            return <div key={k} className={isNew ? "flow-reveal" : ""}><WireField def={fieldDef(k)} value={data[k]} onChange={(v) => set(k, v)} minRows={2} /></div>;
          })}
        </div>
        <div className="row between wrap" style={{ marginTop: 12, alignItems: "center" }}>
          <span className="lint-meta">checks stay off while you draft — they’re one click away when you want them</span>
          {nextDef
            ? <button className="w-btn w-btn--sm" type="button" onClick={() => setReveal((r) => r + 1)}>Add {nextDef.label} →</button>
            : <span className="chip chip--trust">✓ full five-field bundle</span>}
        </div>
      </div>
    );
  } else if (step === 3) {
    panel = (
      <div>
        <span className="flow-kicker">Step 4 · Personal statement</span>
        <h3>Now the statement — you’ve already started it</h3>
        <p className="flow-lead">Here’s your compass line, carried forward. You’re not starting from nothing — you’re sharpening a sentence you already wrote, now against the contribution you just drafted.</p>
        <div className="w-field">
          <div className="w-flabel"><span className="nm">Why this area matters</span><span className="hint">your compass, brought forward — refine it</span></div>
          <WireTA value={data.compass} onChange={(v) => set("compass", v)} minRows={3} placeholder="Sharpen the line you wrote at the start…" />
        </div>
        <div className="w-field">
          <div className="w-flabel"><span className="nm">Why your particular work matters in it</span><span className="hint">now you can point to a real contribution</span></div>
          <WireTA value={data.whyMine} onChange={(v) => set("whyMine", v)} minRows={3} placeholder={data.activities ? "Point to what you just drafted above…" : "I have developed methods now used in clinical trials at four institutions…"} />
        </div>
        <div style={{ padding: "10px 12px", background: "var(--accent-soft)", border: "1px solid var(--accent-line)", borderRadius: 6, fontSize: 12.5, color: "var(--ink-2)" }}>
          Notice how the compass line you wrote first probably reads differently now. That movement — seeing your own thinking sharpen — is the quiet antidote to “my work doesn’t count” (<PainTag n={4} />).
        </div>
      </div>
    );
  } else {
    const rf = (label, val) => (
      <div className="flow-review-field"><div className="fk">{label}</div><div className={"fv" + (val ? "" : " empty")}>{val || "— not yet written —"}</div></div>
    );
    panel = (
      <div>
        <span className="flow-kicker">Step 5 · Review — everything in one place</span>
        <h3>Your draft, all in one view</h3>
        <p className="flow-lead">This is the one screen that shows everything at once — so you read top to bottom and never hunt between sections. Edit anything in place; nothing is locked.</p>
        <div className="flow-review-block">
          <h5>Personal statement <button className="w-btn w-btn--sm w-btn--ghost" type="button" onClick={() => go(3)} style={{ marginLeft: "auto" }}>edit</button></h5>
          {rf("Why this area matters", data.compass)}
          {rf("Why my work matters in it", data.whyMine)}
        </div>
        <div className="flow-review-block">
          <h5>Contribution — bundle 1 <button className="w-btn w-btn--sm w-btn--ghost" type="button" onClick={() => go(2)} style={{ marginLeft: "auto" }}>edit</button></h5>
          {["activities", "outputs", "outcomes", "evidence", "impact"].map((k) => <React.Fragment key={k}>{rf(fieldDef(k).label, data[k])}</React.Fragment>)}
        </div>
        <div className="row between wrap" style={{ marginTop: 4, alignItems: "center" }}>
          <TrustTag>nothing left your device</TrustTag>
          <button className="w-btn w-btn--primary w-btn--sm" type="button">Export draft + revision plan</button>
        </div>
      </div>
    );
  }

  return (
    <Frame title="flow-in-motion.html · one space at a time · recommended order · all-access only at review">
      {rail}
      <div className="flow-stage">
        <div className={"flow-panel " + dir} key={step}>{panel}</div>
        <div className="flow-nav">
          <button className="w-btn w-btn--sm" type="button" disabled={step === 0} onClick={() => go(step - 1)} style={{ visibility: step === 0 ? "hidden" : "visible" }}>← Back</button>
          <span className="flow-footer-note">{step < 4 ? "You can always come back — nothing is locked." : "Done. Revisit any step from the rail above."}</span>
          {step < FLOW_STEPS.length - 1
            ? <button className="w-btn w-btn--primary w-btn--sm" type="button" onClick={() => go(step + 1)}>{step === 0 ? "Begin →" : step === 3 ? "Review everything →" : "Continue →"}</button>
            : <button className="w-btn w-btn--sm" type="button" onClick={() => go(0)}>Start over</button>}
        </div>
      </div>
    </Frame>
  );
}

function FlowSection() {
  return (
    <section className="qsection" id="flow">
      <div className="qhead">
        <span className="qno" style={{ color: "var(--ink)" }}>The recommendation, in motion</span>
        <h2>One focused space — bit by bit — toward the personal statement</h2>
        <p className="lede">Not a long scroll and not a gated march: a single calm panel at a time, in your recommended order, each step a small ask. It plants a personal-statement seed early, walks the bundle in stages, and opens <em>everything at once only at review</em> — so the researcher never jumps around hunting.</p>
      </div>
      <div className="diagnosis" style={{ borderLeftColor: "var(--ink)" }}>
        <Kicker style={{ color: "var(--ink)" }}>What this assembles</Kicker>
        <p style={{ margin: 0, fontSize: 14.5, color: "var(--ink-2)" }}>The hub’s kept order (1B) · the bookended personal statement (1C) · the stepwise five-field bundle (3B) · feedback quiet by default (4B/4C). One experience, walkable end-to-end below.</p>
      </div>
      <article className="direction">
        <FlowInMotion />
        <Pin n={1}>This is the direct answer to your note: <b>sit in one space, think step by step, get prepped for the personal statement.</b> The compass at Step 2 and the carry-forward at Step 4 are the bookends doing their job.</Pin>
        <Pin n={2}>The <b>all-access view lives only at Review</b> — exactly where you said it belongs. During drafting the researcher faces one panel; at review they see the whole draft in a single place and edit in context.</Pin>
      </article>
    </section>
  );
}

function App() {
  return (
    <div>
      <TocStrip />
      <div className="report">
        <Cover />
        <PainRail />
        <QuestionSection q={window.Q1} id="q1" />
        <QuestionSection q={window.Q3} id="q3" />
        <QuestionSection q={window.Q4} id="q4" />
        <FlowSection />
        <Synthesis />
        <p className="footnote">
          Wireframe · greyscale by intent · lint engine ported verbatim from the Phase-F prototype · constraints noted, not yet demonstrated (bilingual / SGQRI — deferred per scope)
        </p>
      </div>
    </div>
  );
}

try {
  if (!window.Q1 || !window.Q3 || !window.Q4) {
    throw new Error("Missing question modules: " +
      ["Q1", "Q3", "Q4"].filter((k) => !window[k]).join(", ") +
      " — a q*.jsx file failed to compile. Also Frame=" + typeof window.Frame);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  document.getElementById("root").innerHTML =
    '<pre style="white-space:pre-wrap;padding:24px;font:13px monospace;color:#b00">' +
    (e && e.stack ? e.stack : String(e)) + "</pre>";
}

      <line x1="37" y1="52" x2="58" y2="52" stroke="#c9c8c2" stroke-width="2.5"/>
