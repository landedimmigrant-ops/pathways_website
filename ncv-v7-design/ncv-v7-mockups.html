<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Narrative CV V7 mock-ups</title>
<!--
  Narrative CV tool, V7 design mock-ups (2026-10-27). A clickable picture of the redesign, not the app.
  One file: inline CSS and JS, no network, no fonts, inline SVG only. Every draft, person and number
  shown is invented. The product styles below use the Pathways tokens (styles.css :root and the
  .narrative-* / .v4-* families); the dark bar at the foot is the mock-up's own control panel and is
  not part of the design. Deep links for screenshots: #s=<screen>&st=<state>&w=desktop|phone&clean=1
-->
<style>
/* ── Tokens: reused from styles.css :root, plus the V7 additions (see DESIGN-NOTES.md) ───────── */
:root{
  --bg:#ffffff; --burgundy:#912338; --text:#1a1a1a; --muted:#5a5a5a; --border:#e6e6e6; --link:#912338;
  --panel:#f8f8f8; --panel-border:#eeeeee; --card:#fafafa; --card-border:#e0e0e0;
  --done:#2a6e2a; --tint:#f9ebed; --tint-2:#f9f3f4; --tint-border:#f4d0d5; --warn:#da3a16; --warn-text:#7a1f15;
  /* new in V7 */
  --explain-bg:#f3f3f3; --field-border:#949494; --rule:#ececec; --faint:#6b6b6b; --track:#e3e3e3;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --fs-xs:.75rem; --fs-sm:.85rem; --fs-md:.9rem; --fs-base:1rem; --fs-lg:1.05rem; --fs-h2:1.4rem; --fs-num:1.9rem;
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px;
  --ease:cubic-bezier(.2,0,0,1); --t-fast:120ms; --t-med:200ms; --t-slow:260ms;
  --lh-box:1.5; --box-lines:8;
  /* the six jobs: existing skeleton tints and borders from the V7 file */
  --j-stakes:#e5a712; --j-role:#912338; --j-activities:#0072a8; --j-outputs:#508212; --j-outcomes:#da3a16; --j-impact:#573996;
  --jt-stakes:#f7e5b8; --jt-role:#e7cfd3; --jt-activities:#bfdce9; --jt-outputs:#d3e0c4; --jt-outcomes:#f7d4cc; --jt-impact:#ddd7ea;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:auto}
body{margin:0;background:#e9e9e9;color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55;padding-bottom:150px}
body.clean{padding-bottom:0;background:#fff}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--burgundy);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:1em;height:1em;fill:currentColor;flex-shrink:0;vertical-align:-.15em}

/* ── The frame (desktop or 375 px phone) ─────────────────────────────────────────────────────── */
.frame{container-type:inline-size;container-name:app;background:var(--bg);margin:0 auto;max-width:1120px;min-height:100vh;box-shadow:0 0 0 1px #d8d8d8}
body.phone .frame{max-width:375px;box-shadow:0 0 0 1px #cfcfcf,0 10px 40px rgba(0,0,0,.12)}
body.clean .frame{box-shadow:none}

/* banner (existing .proto-banner) */
.banner{position:sticky;top:0;z-index:50;background:#1a1a1a;color:#e5a712;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;font-weight:600;letter-spacing:.04em;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.banner strong{color:#f9ca24}
.banner-actions{display:flex;gap:14px;align-items:center;white-space:nowrap}
.banner-btn{background:#e5a712;color:#1a1a1a;border:0;border-radius:4px;padding:4px 10px;font-weight:700;letter-spacing:.02em;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.banner-btn:focus-visible{outline:2px solid #fff}
.banner a{color:#e5a712}

.shell-pad{padding:var(--sp-5) 20px var(--sp-7)}
.page-head{max-width:1060px;margin:0 auto var(--sp-5)}
.page-head h1{font-size:clamp(22px,3vw,30px);margin:0 0 4px;color:var(--burgundy);line-height:1.2}
.subtitle{color:var(--muted);font-size:15px;margin:0 0 var(--sp-4)}
.intro{max-width:70ch;margin:0 0 var(--sp-3);font-size:var(--fs-base)}
.guide-line{max-width:70ch;margin:0 0 var(--sp-3)}
.privacy{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:.82rem;margin:0;max-width:78ch}
.privacy .ico{margin-top:2px}
.page-head.is-start{padding-bottom:var(--sp-5);border-bottom:1px solid var(--border)}

.shell{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;align-items:start}

/* ── Rail (extends .narrative-progress-panel / .narrative-stage-item) ───────────────────────── */
.rail{position:sticky;top:48px;background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--r-xl);padding:var(--sp-5)}
.rail h2{font-size:.95rem;font-weight:700;margin:0 0 var(--sp-4);color:#333}
.rail-group{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 var(--sp-1)}
.rail-group+ul{margin-bottom:var(--sp-4)}
.rail ul{list-style:none;margin:0;padding:0}
.ri{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:10px;width:100%;text-align:left;background:none;border:0;padding:6px 0;cursor:pointer;color:#555;font-size:.88rem;line-height:1.35;border-radius:4px;transition:color var(--t-fast)}
.ri:hover{color:var(--burgundy)}
.ri .mk{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;margin-top:4px;transition:background var(--t-med) var(--ease),border-color var(--t-med)}
.ri.sq .mk{border-radius:2px}
.ri .lb{min-width:0}
.ri .mt{grid-column:2;font-size:var(--fs-xs);color:var(--muted);font-weight:400;margin-top:1px}
.ri.is-done{color:var(--done)}
.ri.is-done .mk{background:currentColor}
.ri.is-active{color:var(--burgundy);font-weight:700}
.ri.is-active.is-done .mk{background:var(--done);border-color:var(--done)}
.ri.is-quiet{color:var(--faint)}
.rail-cap{font-size:var(--fs-xs);color:var(--faint);margin:-2px 0 var(--sp-4) 20px;line-height:1.4}
.tally{border-top:1px solid #e2e2e2;padding-top:var(--sp-3);margin-top:var(--sp-1);font-size:var(--fs-xs);color:var(--muted)}
.tally b{display:block;color:#333;font-size:.78rem;margin-bottom:2px}
.lenbar{height:6px;background:var(--track);border-radius:3px;margin:6px 0 4px;overflow:hidden;position:relative}
.lenbar i{display:block;height:100%;background:#7a7a7a;border-radius:3px;transition:width var(--t-slow) var(--ease)}
.rail-save{display:inline-flex;gap:6px;align-items:center;margin-top:var(--sp-3);font-size:.82rem;color:var(--burgundy);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ── Step header and shared text ─────────────────────────────────────────────────────────────── */
.tailored{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--fs-xs);color:var(--muted);margin:0 0 var(--sp-4)}
.pill{display:inline-block;background:var(--tint);color:var(--burgundy);border-radius:12px;padding:1px 9px;font-size:.78rem}
.linkbtn{background:none;border:0;padding:0;color:var(--burgundy);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:inherit}
.step-head{margin:0 0 var(--sp-5);padding-bottom:var(--sp-3);border-bottom:2px solid #f0f0f0}
.step-head h2{font-size:var(--fs-h2);font-weight:700;margin:0 0 var(--sp-2);color:var(--burgundy);line-height:1.25}
.step-head p{margin:0;max-width:74ch;font-size:.95rem}
.quiet{font-size:var(--fs-sm);color:var(--muted);margin:0}
.note{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-sm);color:var(--muted);margin:var(--sp-3) 0 0}
.note .ico{color:var(--muted);margin-top:2px;font-size:1.05em}
.h3{font-size:1rem;font-weight:700;margin:0 0 var(--sp-3);color:var(--text)}

/* buttons (existing .btn / .btn-primary) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--burgundy);background:#fff;color:var(--burgundy);padding:9px 16px;font-size:14px;font-weight:600;line-height:1.2;cursor:pointer;border-radius:2px;min-height:40px;transition:background var(--t-fast),color var(--t-fast)}
.btn:hover{background:var(--tint-2)}
.btn.primary{background:var(--burgundy);color:#fff}
.btn.primary:hover{background:#7a1d2f}
.btn.small{min-height:32px;padding:5px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;text-decoration:underline;text-underline-offset:2px;padding-left:4px;padding-right:4px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-4);flex-wrap:wrap;margin-top:var(--sp-6);padding-top:var(--sp-4);border-top:1px solid #eee}
.nav .note{margin:0;flex:1 1 260px}

/* ── Start page: path row ────────────────────────────────────────────────────────────────────── */
.paths{display:grid;grid-template-columns:minmax(0,1fr) 172px;gap:var(--sp-4);align-items:stretch}
.path{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;text-align:left;cursor:pointer;border-radius:var(--r-lg);padding:var(--sp-5);font:inherit;transition:transform var(--t-fast) var(--ease),box-shadow var(--t-med),border-color var(--t-fast)}
.path-new{background:var(--burgundy);color:#fff;border:2px solid var(--burgundy)}
.path-new:hover{box-shadow:0 6px 20px rgba(145,35,56,.25);transform:translateY(-1px)}
.path-new h3{font-size:1.25rem;margin:0 0 var(--sp-2);line-height:1.25}
.path-new p{margin:0 0 var(--sp-4);font-size:.92rem;line-height:1.55;color:#fbeef0;max-width:58ch}
.path-new .go{margin-top:auto;display:inline-flex;gap:8px;align-items:center;background:#fff;color:var(--burgundy);font-weight:700;font-size:14px;border-radius:2px;padding:8px 14px}
.path-cont{background:#fff;border:2px solid var(--card-border);color:var(--text);width:100%;min-height:172px;padding:var(--sp-4) var(--sp-4) var(--sp-5)}
.path-cont:hover{border-color:var(--burgundy)}
.path-cont .ico{font-size:28px;color:var(--burgundy);margin-bottom:var(--sp-3)}
.path-cont h3{font-size:1rem;margin:0 0 var(--sp-1);line-height:1.25}
.path-cont p{margin:0;font-size:.8rem;color:var(--muted);line-height:1.45}

/* ── Opening statement ───────────────────────────────────────────────────────────────────────── */
.lede{font-size:1rem;margin:0 0 var(--sp-2);max-width:70ch}

/* ── Questions (Profile) ─────────────────────────────────────────────────────────────────────── */
.qcount{font-size:var(--fs-xs);color:var(--muted);text-align:right;margin:0 0 var(--sp-2)}
.qblock{background:#fff;border:1px solid var(--card-border);border-left:3px solid var(--burgundy);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5) var(--sp-5);margin:0 0 var(--sp-3)}
.q{font-size:var(--fs-lg);font-weight:600;margin:0 0 var(--sp-2);line-height:1.35;display:block}
.explain{display:flex;gap:10px;align-items:flex-start;background:var(--explain-bg);border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-sm);color:var(--muted);line-height:1.55;margin:0 0 var(--sp-4);max-width:78ch}
.explain .ico{font-size:1.1em;margin-top:2px;color:#6b6b6b}
.explain p{margin:0}
.explain p+p{margin-top:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:var(--sp-3)}
.choice{position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--card-border);border-radius:var(--r-lg);padding:12px 14px;cursor:pointer;min-height:64px;transition:border-color var(--t-fast),background var(--t-fast)}
.choice:hover{border-color:var(--burgundy)}
.choice b{font-size:1rem;line-height:1.25}
.choice small{display:block;font-size:.74rem;color:var(--muted);line-height:1.35;margin-top:3px}
.choice[aria-pressed="true"],.choice[aria-checked="true"]{border-color:var(--burgundy);background:var(--tint-2)}
.choice .tick{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--burgundy);color:#fff;display:none;align-items:center;justify-content:center;font-size:12px}
.choice[aria-pressed="true"] .tick,.choice[aria-checked="true"] .tick{display:flex}
.choice.wide{grid-column:1/-1;min-height:0;flex-direction:row;gap:8px;align-items:center}
.minis{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.mini{border:1px solid var(--field-border);background:#fff;border-radius:16px;padding:5px 12px;font-size:.86rem;cursor:pointer;min-height:32px}
.mini[aria-checked="true"],.mini[aria-pressed="true"]{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
.field-label{display:block;font-size:var(--fs-sm);font-weight:600;color:#444;margin:0 0 4px}
.field-label .opt{font-weight:400;color:var(--muted)}
.input,.select{width:100%;border:1px solid var(--field-border);border-radius:var(--r-sm);padding:9px 10px;background:#fff;font-size:.92rem;min-height:40px}
.input:focus,.select:focus,.box:focus{outline:none;border-color:var(--burgundy);box-shadow:0 0 0 2px rgba(145,35,56,.18)}
.comp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp-3);align-items:end;margin-bottom:var(--sp-4)}
.feedback{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-sm);color:var(--done);margin:6px 0 0}
.feedback .ico{margin-top:2px}

/* ── The answered row: ONE component for a folded Profile answer and a shrunk card field ──────── */
.ans{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:start;width:100%;text-align:left;background:#fff;border:1px solid var(--card-border);border-radius:var(--r-md);padding:9px 12px;cursor:pointer;transition:border-color var(--t-fast)}
.ans:hover{border-color:#b9b9b9}
.ans-k{font-size:var(--fs-xs);font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;letter-spacing:.01em}
.ans{position:relative;overflow:hidden}
.ans-v{grid-column:1;font-size:.9rem;color:var(--text);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* long answers: the words stay at full contrast (clamped at three lines with an ellipsis); only the
   padding strip below them fades, as a cue that there is more */
.ans:has(.ans-v.is-long)::after{content:"";position:absolute;left:1px;right:1px;bottom:0;height:9px;background:linear-gradient(180deg,rgba(255,255,255,0),#ececec);pointer-events:none}
.ans-d{grid-column:1;font-size:.8rem;color:var(--done);display:flex;gap:6px;align-items:flex-start}
.ans-edit{grid-column:2;grid-row:1/span 2;font-size:.8rem;color:var(--burgundy);text-decoration:underline;text-underline-offset:2px;white-space:nowrap;align-self:center}
.prof-list{display:flex;flex-direction:column;gap:var(--sp-2);margin:0 0 var(--sp-3)}

/* ── Card (one card for contributions, people, Mentorship style, Your statement, order, export) ── */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5) var(--sp-5);margin:0 0 var(--sp-4)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);margin:0 0 var(--sp-3);min-height:28px}
.card-t{font-weight:600;font-size:.95rem;color:#333;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-t .num{color:var(--burgundy)}
.card-side{display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:.8rem;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:#d4d4d4;transition:background var(--t-med)}
.dots i.on{background:var(--done)}
.icon-btn{width:30px;height:30px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#777;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.icon-btn:hover{color:var(--burgundy);border-color:var(--burgundy)}
.card-sub{font-size:var(--fs-sm);color:var(--muted);margin:-4px 0 var(--sp-3)}
.fields{display:flex;flex-direction:column;gap:var(--sp-2)}

/* field: open / filled (shrunk with answer) / empty (shrunk, one-line box) */
.f{position:relative;border-radius:var(--r-md);transition:background var(--t-med),border-color var(--t-med),padding var(--t-med) var(--ease)}
.f-k{font-size:var(--fs-xs);font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;margin:0 0 4px}
.jd{width:8px;height:8px;border-radius:2px;background:var(--jc,#bdbdbd);flex-shrink:0}
.f-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-med) var(--ease),opacity var(--t-med);opacity:0}
.f-more>div{overflow:hidden;min-height:0}
.f.is-open{background:#fff;border:1px solid var(--card-border);border-left:3px solid var(--burgundy);padding:12px 16px 14px}
.f.is-open .f-more{grid-template-rows:1fr;opacity:1}
.f.is-open .f-k{color:var(--burgundy)}
.f .q{font-size:1rem;margin:2px 0 8px}
.f .explain{margin-bottom:12px}
.box{display:block;width:100%;border:1px solid var(--field-border);border-radius:var(--r-sm);background:#fff;padding:8px 10px;font-size:.92rem;line-height:var(--lh-box);resize:none;overflow:auto;transition:height var(--t-med) var(--ease),opacity var(--t-fast),padding var(--t-med),border-color var(--t-fast)}
textarea.box{height:calc(var(--box-lines) * var(--lh-box) * 1em + 18px)}
.f.is-empty textarea.box{height:calc(1.5em + 18px);overflow:hidden}
.f.is-filled .box{height:0;min-height:0;padding-top:0;padding-bottom:0;border-color:transparent;opacity:0}
.f.is-filled .anchor-line{height:0;overflow:hidden;opacity:0}
.f.is-filled .f-k{display:none}
.f .ans{display:none}
.f.is-filled .ans{display:grid}
.f.is-empty{padding:0}
.f-checks{font-size:.8rem;line-height:1.5;margin-top:8px}
.f:not(.is-open) .f-checks{display:none}
.f-checks .fl{color:#b02a0a;display:block}
.f-checks .st{color:var(--done);display:block}
.f-checks .first{color:var(--muted);display:block;margin-top:4px}
.f-aside{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:var(--sp-4);align-items:start}
.cross{background:var(--panel);border:1px dashed #cfcfcf;border-radius:var(--r-md);padding:10px 12px;font-size:.8rem;color:#444;line-height:1.5}
.cross b.t{display:block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--burgundy);margin-bottom:4px}
.cross p{margin:0 0 6px}
.cross p.m{color:var(--muted);margin:0}
.levels{margin:0 0 10px}
.anchor-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.95rem}
.anchor-line .input{flex:1 1 150px;width:auto}
.f-ev-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px dashed #c4c4c4;border-radius:var(--r-md);padding:9px 12px}
.f-ev-row .f-k{margin:0}
.f-ev-row span.s{font-size:.85rem;color:var(--muted)}

/* strip: Your paragraph so far / What you wrote / Your statement so far (one element) */
.strip{background:#fff;border:1px solid var(--card-border);border-radius:var(--r-md);padding:12px 16px;margin-top:var(--sp-3)}
.strip-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}
.strip-h b{font-size:var(--fs-xs);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.strip p{margin:0;font-size:.9rem;line-height:1.7}
.strip .role{font-style:italic;color:var(--muted);font-size:.85rem;margin-bottom:4px}
.join{display:inline-block;background:#fff8e1;color:#555;border:1px solid #f0c94a;border-radius:10px;padding:0 8px;font-size:.72rem;font-style:italic;margin:0 3px;vertical-align:1px;white-space:nowrap}
.gap{display:block;color:var(--warn-text);font-size:.8rem;margin-top:6px}
.strip .empty{color:var(--muted);font-style:italic}
.seg-new{animation:segin var(--t-slow) var(--ease)}
@keyframes segin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* evidence */
.ev-area{margin-top:var(--sp-3)}
.ev-items{display:flex;flex-direction:column;gap:var(--sp-2);margin:0 0 var(--sp-3)}
.ev-item{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 10px;background:#fff;border:1px solid var(--card-border);border-radius:var(--r-md);padding:10px 12px;font-size:.88rem}
.badge{width:22px;height:22px;border-radius:50%;background:var(--burgundy);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.ev-item .ty{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--burgundy)}
.ev-item .why{color:var(--muted);font-size:.82rem}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:8px;margin:0 0 var(--sp-4)}
.kind{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--card-border);border-radius:var(--r-md);padding:8px 10px;cursor:pointer;transition:border-color var(--t-fast),background var(--t-fast)}
.kind:hover{border-color:var(--burgundy)}
.kind b{font-size:.85rem}
.kind small{font-size:.74rem;color:var(--muted);line-height:1.35}
.kind[aria-checked="true"]{border-color:var(--burgundy);background:var(--tint-2)}
textarea.box.two{height:calc(2 * var(--lh-box) * 1em + 18px)}

/* dashed add button (existing .add-contribution-btn) */
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px dashed #c4c4c4;border-radius:var(--r-md);background:none;padding:12px;color:#555;font-size:.92rem;font-weight:600;cursor:pointer;transition:border-color var(--t-fast),color var(--t-fast);margin:0 0 var(--sp-4)}
.add:hover{border-color:var(--burgundy);color:var(--burgundy)}

/* folded summary row */
.fold{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-lg);padding:12px 16px;margin:0 0 var(--sp-3);cursor:pointer}
.fold:hover{border-color:#bdbdbd}
.fold .t{flex:1;min-width:0;font-weight:600;font-size:.92rem;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobs{display:inline-flex;gap:3px}
.jobs i{width:14px;height:14px;border-radius:3px;background:#e4e4e4;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-style:normal}
.fold .meta{font-size:.78rem;color:var(--muted);white-space:nowrap}
.fold .op{font-size:.8rem;color:var(--burgundy);white-space:nowrap}

/* example controls + example box */
.ex-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 var(--sp-4)}
.ex-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--field-border);border-radius:20px;padding:6px 14px;font-size:.86rem;cursor:pointer;color:var(--text);min-height:36px}
.ex-btn:hover{border-color:var(--burgundy);color:var(--burgundy)}
.ex-btn .pm{font-weight:700;color:var(--burgundy);width:10px;text-align:center}
.ex-btn[aria-expanded="true"]{border-color:var(--burgundy);background:var(--tint-2)}
.exbox{background:#fff;border:1px solid var(--card-border);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);margin:-4px 0 var(--sp-5);animation:reveal var(--t-slow) var(--ease)}
@keyframes reveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.exbox-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 var(--sp-3)}
.fiction{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:#1a1a1a;border-radius:4px;padding:3px 9px}
.exbox h4{margin:0 0 4px;font-size:.98rem}
.exbox .match{font-size:.8rem;color:var(--muted);margin:0 0 10px}
.exemplar{font-size:.92rem;line-height:1.8;margin:0}
.exemplar .seg{border-radius:4px;padding:1px 2px;transition:background var(--t-med),box-shadow var(--t-med)}
.built .seg-stakes{background:var(--jt-stakes);box-shadow:inset 3px 0 0 var(--j-stakes);padding-left:6px}
.built .seg-role{background:var(--jt-role);box-shadow:inset 3px 0 0 var(--j-role);padding-left:6px}
.built .seg-activities{background:var(--jt-activities);box-shadow:inset 3px 0 0 var(--j-activities);padding-left:6px}
.built .seg-outputs{background:var(--jt-outputs);box-shadow:inset 3px 0 0 var(--j-outputs);padding-left:6px}
.built .seg-outcomes{background:var(--jt-outcomes);box-shadow:inset 3px 0 0 var(--j-outcomes);padding-left:6px}
.built .seg-impact{background:var(--jt-impact);box-shadow:inset 3px 0 0 var(--j-impact);padding-left:6px}
.legend{display:none;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.built .legend{display:flex;animation:reveal var(--t-slow) var(--ease)}
.legend span{font-size:.74rem;font-weight:600;border-radius:10px;padding:2px 9px;color:#333}
.exfoot{font-size:.78rem;color:var(--muted);margin:12px 0 0;padding-top:10px;border-top:1px solid var(--rule)}
.hints{margin:0;padding-left:1.1em;font-size:.88rem}
.hints li{margin:0 0 3px}

/* toggle switch */
.switch{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;cursor:pointer;font-size:.9rem;font-weight:600;color:var(--text)}
.switch .tr{position:relative;width:38px;height:22px;border-radius:11px;background:#8a8a8a;transition:background var(--t-med) var(--ease);flex-shrink:0}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform var(--t-med) var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"] .tr{background:var(--burgundy)}
.switch[aria-checked="true"] .tr::after{transform:translateX(16px)}

/* dashboard tiles (Mentorship totals, Review at a glance) */
.dash{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5) var(--sp-5);margin:0 0 var(--sp-5)}
.dash-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 var(--sp-3)}
.dash-h .h3{margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3)}
.tile{background:#fff;border:1px solid var(--card-border);border-radius:var(--r-md);padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.tile label{font-size:.78rem;color:var(--muted);font-weight:600;order:2}
.tile input{order:1;border:0;border-bottom:2px solid #d0d0d0;border-radius:0;padding:0 0 2px;font-size:var(--fs-num);font-weight:700;line-height:1.15;width:100%;background:transparent;color:var(--text);-moz-appearance:textfield}
.tile input::-webkit-outer-spin-button,.tile input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tile input:focus{outline:none;border-bottom-color:var(--burgundy)}
.tile input::placeholder{color:#b5b5b5;font-weight:400}
.glance{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--sp-3)}
.glance .tile{padding:12px 14px}
.glance ul{margin:6px 0 0;padding:0;list-style:none;font-size:.88rem}
.glance li{padding:4px 0;border-bottom:1px solid var(--rule)}
.glance li:last-child{border-bottom:0}
.glance .ok{display:flex;gap:8px;align-items:center;color:var(--done);font-weight:600;font-size:.9rem;margin-top:6px}
.tile-k{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.big{font-size:var(--fs-num);font-weight:700;line-height:1.1}
.pages{position:relative;height:10px;background:var(--track);border-radius:5px;margin:10px 0 4px;overflow:hidden}
.pages i{position:absolute;inset:0 auto 0 0;background:#7a7a7a;border-radius:5px}
.pages s{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.pages-scale{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}

/* people */
.counter{font-size:.85rem;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin:0 0 var(--sp-3)}
.one{margin:0 0 var(--sp-3)}
.revealed{animation:reveal var(--t-slow) var(--ease)}
.early{background:#f5f5f5;border-left:3px solid var(--burgundy);border-radius:0 6px 6px 0;padding:10px 14px;font-size:.9rem;color:#444;margin:0 0 var(--sp-4)}
.section-t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 var(--sp-3)}
.section-t .h3{margin:0}

/* review */
.draft{background:#fff;border:1px solid var(--card-border);border-radius:var(--r-md);overflow:hidden;transition:height var(--t-slow) var(--ease)}
.draft-body{height:calc(14 * 1.6em + 28px);overflow:auto;padding:14px 18px;font-family:Arial,Helvetica,sans-serif;font-size:.88rem;line-height:1.6}
.draft-body.tnr{font-family:"Times New Roman",Times,serif;font-size:.95rem}
.draft-body h4{font-size:.92rem;margin:0 0 4px;color:#222}
.draft-body h4:not(:first-child){margin-top:14px}
.draft-body p{margin:0 0 8px}
.draft-body .r{font-style:italic;color:#444}
.draft-body .refs{font-size:.82rem;color:#444;margin:0 0 10px;padding-left:1em}
.draft.is-shut .draft-body{height:0;padding-top:0;padding-bottom:0}
.slot{font-size:.8rem;color:var(--muted);margin:var(--sp-3) 0 6px;padding-left:2px;max-width:70ch}
.slot b{color:var(--text)}
.ocard{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--card-border);border-radius:var(--r-lg);padding:12px 14px;margin:0 0 var(--sp-2);transition:transform var(--t-slow) var(--ease),box-shadow var(--t-med)}
.ocard .n{width:26px;height:26px;border-radius:50%;background:var(--burgundy);color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.ocard .t{font-weight:600;font-size:.92rem;line-height:1.35}
.ocard .g{font-size:.82rem;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.ocard .mv{display:flex;gap:6px}
.ocard .mv .btn{min-width:40px;min-height:36px;padding:4px 10px;font-size:15px}
.ocard .mv .btn:disabled{opacity:.3;cursor:default}
.ocard.moved{box-shadow:0 0 0 2px rgba(145,35,56,.25)}
.selfcheck label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:.9rem;color:#333;cursor:pointer}
.selfcheck input{margin-top:4px;width:16px;height:16px;accent-color:var(--burgundy);flex-shrink:0}
.closing{margin:var(--sp-3) 0 0;padding:10px 14px;border-left:3px solid var(--burgundy);background:#fbf7f7;font-size:.88rem;border-radius:0 6px 6px 0}

/* export */
.setup-line{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.9rem;margin:-8px 0 var(--sp-5);color:#333}
.setup-line .k{font-weight:700}
.preview{height:calc(10 * 1.6em + 28px)}
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin:0 0 var(--sp-4)}
.fmt .choice{min-height:0}
.rec{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--done);background:#e9f3e9;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.copy-row{display:flex;flex-direction:column;gap:8px;margin:0 0 var(--sp-4)}
.copy-row .btn{justify-content:flex-start;width:100%;max-width:520px}
.fmt-note{border:1px solid var(--border);border-left:4px solid var(--burgundy);border-radius:6px;background:#fbf7f7;padding:12px 14px;font-size:.85rem;line-height:1.55}
.fmt-note p{margin:0 0 6px}
.fmt-note .must{color:var(--burgundy);font-weight:700}
.fmt-note dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:8px 0 0}
.fmt-note dt{font-weight:700}
.fmt-note dd{margin:0;color:#444}
.nudge{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid #f0c94a;background:#fff8e1;border-radius:var(--r-md);padding:14px 16px;margin-top:var(--sp-4);font-size:.9rem}
.nudge p{margin:0;flex:1 1 320px}
.nudge .addr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nudge code{font-family:inherit;font-weight:600;user-select:all}
.copied{font-size:.8rem;color:var(--done);margin-left:8px}

/* ── Phone (container query on the frame, so the width toggle works on a desktop screen) ──────── */
@container app (max-width: 700px){
  .shell-pad{padding:var(--sp-4) 16px var(--sp-6)}
  .shell{grid-template-columns:minmax(0,1fr);gap:var(--sp-4)}
  .card-t{white-space:normal}
  .card-h{align-items:flex-start}
  .banner{padding:8px 12px;font-size:11px}
  .banner .reset{display:none}
  .rail{position:static;padding:var(--sp-4)}
  .rail h2{margin-bottom:var(--sp-2)}
  .ri{grid-template-columns:10px minmax(0,1fr) auto;padding:5px 0}
  .ri .mt{grid-column:3;grid-row:1;align-self:center;margin:0;text-align:right;white-space:nowrap}
  .rail-cap{margin-left:20px}
  .tally{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
  .tally b{display:inline;margin:0}
  .tally .lenbar{flex:1 1 100%;order:3;margin:4px 0 0}
  .paths{grid-template-columns:1fr}
  .path-cont{min-height:0;flex-direction:row;align-items:center;gap:12px;padding:14px 16px}
  .shell.is-start main{order:-1}
  .path-cont .ico{margin:0}
  .choices{grid-template-columns:1fr 1fr}
  .comp-row{grid-template-columns:1fr}
  .qblock{padding:14px 14px 16px}
  .card{padding:14px 14px 16px}
  .card-side .dots{display:none}
  .f.is-open{padding:10px 12px 12px}
  .f-aside{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .pair{grid-template-columns:1fr}
  .glance{grid-template-columns:1fr}
  .fmt{grid-template-columns:1fr}
  .kinds{grid-template-columns:1fr 1fr}
  .ocard{grid-template-columns:26px minmax(0,1fr);}
  .ocard .mv{grid-column:2;justify-content:flex-start}
  .step-head h2{font-size:1.25rem}
  .fold .jobs{display:none}
  .nav{flex-direction:column-reverse;align-items:stretch}
  .nav .btn{width:100%}
}

/* ── Reduced motion: no slides, no height tweens; state changes are instant ─────────────────── */
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition-duration:0ms!important;animation:none!important} }
body.rm *,body.rm *::before,body.rm *::after{transition-duration:0ms!important;animation:none!important}

/* ── Mock-up control bar (not part of the design) ───────────────────────────────────────────── */
.mock{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#262626;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;padding:8px 12px 10px;box-shadow:0 -4px 16px rgba(0,0,0,.25)}
body.clean .mock{display:none}
.mock-row{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:2px 0}
.mock-row>span{color:#9a9a9a;width:78px;flex-shrink:0;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.mock button{background:#3a3a3a;color:#eee;border:1px solid #4a4a4a;border-radius:3px;padding:3px 8px;font-size:12px;cursor:pointer}
.mock button[aria-pressed="true"]{background:#e5a712;color:#1a1a1a;border-color:#e5a712;font-weight:700}
.mock .hide{position:absolute;right:10px;top:6px}
.mock.is-min .mock-row{display:none}
.mock.is-min .mock-row.keep{display:flex}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:13px;padding:8px 14px;border-radius:6px;z-index:300;opacity:0;transition:opacity var(--t-med);pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

  setTimeout(function(){prev.forEach(function(p){p.classList.remove("is-open");p.classList.add(fieldHas(p)?"is-filled":"is-empty");refreshAns(p);});},motionMs(140));
  keepAnchor(f,top,motionMs(140)+motionMs(200)+60);
  if(b[2]==="challenge"||b[2]==="streams"){render(true);} // the cross-contribution note sits beside these two
}
function refreshAns(f){var b=f.getAttribute("data-f").split("|"),v;if(b[0]==="c"){var c=D.contribs[+b[1]];v=b[2]==="role"?[lab(LEVELS,c.level),c.role].filter(Boolean).join(" · "):c[b[2]];}else if(b[0]==="m")v=D.m[b[2]];else v=b[2]==="anchor"?anchorText():D.ps[b[2]];
  var a=f.querySelector(".ans-v");if(a){a.textContent=v||"";a.classList.toggle("is-long",String(v||"").length>220);}var st=f.querySelector("[id$='-st']");if(st)st.textContent=fieldHas(f)?"Answered.":"Not answered yet.";}
function updateChecks(f){var b=(f.getAttribute("data-f")||"").split("|");if(b[0]!=="c")return;var c=D.contribs[+b[1]],t=String(c[b[2]]||""),out=[];if(!t||b[2]==="h")return setChecks(f,"");
  var we=(t.match(/\b(we|our)\b/gi)||[]).length;if(we&&!/\bI\b/.test(t))out.push('<span class="fl">“we” or “our” appears '+we+(we===1?' time':' times')+' with no “I …” nearby. If every sentence says “we”, reviewers cannot tell what you did.</span>');
  var nums=(t.match(/\b\d[\d,]*\b/g)||[]).length;if(nums)out.push('<span class="st">'+nums+' specific number'+(nums>1?'s':'')+'</span>');
  if(b[2]==="changed"){var hd=t.match(/\b(may|might|could|potentially)\b/gi);if(hd)out.push('<span class="fl">“'+hd[0]+'” — this field is for what has happened; what might follow belongs under What could change.</span>');}
  if(out.some(function(x){return x.indexOf('class="fl"')>0;})&&!UI.firstCheckSeen){out.push('<span class="first">The checks under each field are suggestions. They leave you free to continue, carry no score and stay here with your draft.</span>');}
  setChecks(f,out.join(""));}
function setChecks(f,h){var n=f.querySelector(".f-checks");if(n&&n.innerHTML!==h)n.innerHTML=h;}

/* ═══ Events ═══ */
document.addEventListener("focusin",function(e){
  var f=e.target.closest&&e.target.closest("#main .f[data-f]");
  if(f&&(e.target.classList.contains("box")))openField(f);
});
document.addEventListener("click",function(e){
  var t=e.target.closest("button,a,[data-open]");if(!t)return;
  var A=function(n){return t.getAttribute(n);};
  if(A("data-mock")){mockClick(t);return;}
  if(t.closest(".mock"))return;
  if(A("data-go")){e.preventDefault();navTo(A("data-go"));return;}
  if(A("data-open")){var box=document.getElementById(A("data-open"))||t.closest(".f").querySelector(".box");if(box){box.focus();}return;}
  var act=A("data-act");
  if(act==="new"){D.p.started=true;navTo("profile");return;}
  if(act==="toast"){e.preventDefault();toast(A("data-msg"));return;}
  if(act==="email"){e.preventDefault();toast("Opens an email to impact@concordia.ca with the subject “Narrative CV tool: my experience”.");return;}
  if(act==="save"){toast("Saves the whole draft as a small file on your computer.");return;}
  if(act==="built"){UI.built=!UI.built;t.setAttribute("aria-checked",UI.built);document.getElementById("exbox").classList.toggle("built",UI.built);renderMock();return;}
  if(act==="undecided"){D.p.undecided=!D.p.undecided;if(D.p.undecided)D.p.comp="";UI.profEdit=1;render();return;}
  if(act==="addc"){D.contribs.forEach(function(c){c.folded=true;});D.contribs.push(emptyC());var i=D.contribs.length-1;UI.active={s:"c",i:i,k:"h"};render();var n=document.getElementById("c-"+i+"-h");if(n){n.scrollIntoView({block:"center",behavior:motionMs(1)?"smooth":"auto"});n.focus({preventScroll:true});}announce("Contribution "+(i+1)+" added.");return;}
  if(act==="addp"){D.m.people.forEach(function(p){p.folded=true;});D.m.people.push(emptyP());render();var k=D.m.people.length-1,s=document.getElementById("ps"+k);if(s){s.focus();}announce("Person "+String.fromCharCode(65+k)+" added.");return;}
  if(act==="addev"){var ci=+document.querySelector("[data-card]").getAttribute("data-card");var ce=D.contribs[ci];if(UI.evDraft&&(UI.evDraft.type||UI.evDraft.text)){ce.ev.push(UI.evDraft);}UI.evDraft={type:"",text:"",why:""};render();announce("Evidence item "+String.fromCharCode(97+ce.ev.length)+" added.");return;}
  if(act==="draft"){UI.draftOpen=!UI.draftOpen;render(true);return;}
  if(act==="download"){D.exported=true;renderRail();toast("Downloads "+(UI.fmt==="doc"?"a Word file (.doc)":"a text file (.txt)")+".");return;}
  if(act==="copy"){D.exported=true;renderRail();var w=A("data-what");document.querySelectorAll("[data-copied]").forEach(function(x){x.textContent="";});var c=document.querySelector('[data-copied="'+w+'"]');if(c)c.textContent="Copied";return;}
  if(A("data-agency")){D.p.agency=A("data-agency");UI.profEdit=null;render();focusQ();announce("Agency: "+agencyOf(D.p.agency).a+". Next question: competition.");return;}
  if(A("data-year")){D.p.year=D.p.year===A("data-year")?"":A("data-year");UI.profEdit=(D.p.comp||D.p.undecided)?null:1;render();return;}
  if(A("data-stage")){D.p.stage=A("data-stage");UI.profEdit=null;render();focusQ();return;}
  if(A("data-disc")){D.p.disc=A("data-disc");if(D.p.disc2===D.p.disc)D.p.disc2="";UI.profEdit=null;render();focusQ();return;}
  if(A("data-disc2")){D.p.disc2=A("data-disc2");UI.profEdit=null;render();focusQ();return;}
  if(A("data-mode")){var v=A("data-mode"),m=D.p.modes,ix=m.indexOf(v);if(ix>=0)m.splice(ix,1);else m.push(v);UI.profEdit=5;render();return;}
  if(A("data-pedit")){UI.profEdit=+A("data-pedit");render();var q=document.querySelector('[data-pq="'+UI.profEdit+'"] button,[data-pq="'+UI.profEdit+'"] input');if(q)q.focus();return;}
  if(A("data-ex")){var x=A("data-ex");UI.ex=UI.ex===x?null:x;render(true);return;}
  if(A("data-level")){var lv=A("data-level").split("|");D.contribs[+lv[0]].level=lv[1];t.parentNode.querySelectorAll(".mini").forEach(function(b){b.setAttribute("aria-checked",b===t);});liveCard(+lv[0]);return;}
  if(A("data-evon")){UI.ev[+A("data-evon")]=true;UI.active=null;if(!UI.evDraft&&!D.contribs[+A("data-evon")].ev.length)UI.evDraft={type:"",text:"",why:""};render();var area=document.querySelector(".ev-area");if(area)area.scrollIntoView({block:"start",behavior:"auto"});return;}
  if(A("data-evoff")){UI.ev[+A("data-evoff")]=false;UI.evDraft=null;render();return;}
  if(A("data-kind")){if(!UI.evDraft)UI.evDraft={type:"",text:"",why:""};UI.evDraft.type=A("data-kind");t.parentNode.querySelectorAll(".kind").forEach(function(b){b.setAttribute("aria-checked",b===t);});return;}
  if(A("data-fold")){D.contribs[+A("data-fold")].folded=true;UI.active=null;render();return;}
  if(A("data-unfold")){var ui=+A("data-unfold");D.contribs.forEach(function(c,j){c.folded=j!==ui;});UI.active=null;render();return;}
  if(A("data-pfold")){var pi=+A("data-pfold");D.m.people.forEach(function(p,j){p.folded=j!==pi;});render();return;}
  if(A("data-fmt")){UI.fmt=A("data-fmt");render(true);return;}
  if(A("data-mv")){var mv=A("data-mv").split("|");moveContrib(+mv[0],+mv[1]);return;}
  if(A("data-jump")){e.preventDefault();var j=A("data-jump").split("|");navTo(j[0]);if(j[0]==="contrib"){D.contribs.forEach(function(c,k){c.folded=k!==+j[1];});if(j[2]==="ev"){UI.ev[+j[1]]=true;UI.evDraft={type:"",text:"",why:""};}else UI.active={s:"c",i:+j[1],k:j[2]};}else UI.active={s:j[0]==="mentor"?"m":"ps",i:0,k:j[2]};render();var target=document.querySelector("#main .f.is-open .box")||document.querySelector(".ev-area");if(target){target.scrollIntoView({block:"center"});if(target.focus)target.focus({preventScroll:true});}return;}
});
document.addEventListener("input",function(e){
  var t=e.target, b=t.getAttribute("data-b");
  if(b){var p=b.split("|");if(p[0]==="c"){D.contribs[+p[1]][p[2]]=t.value;liveCard(+p[1]);updateChecks(t.closest(".f"));}else if(p[0]==="m"){D.m[p[2]]=t.value;liveMentor();}else{D.ps[p[2]]=t.value;livePs();}renderRail();return;}
  if(t.getAttribute("data-ps")){D.ps[t.getAttribute("data-ps")]=t.value;var art=document.querySelector("[data-art]");if(art)art.textContent=article(D.ps.role);livePs();renderRail();return;}
  if(t.getAttribute("data-pf")==="comp"){var was=!!D.p.comp;D.p.comp=t.value;UI.profEdit=1;if(was!==!!D.p.comp)render(true);else{renderRail();}return;}
  if(t.getAttribute("data-tot")){D.m.tot[t.getAttribute("data-tot")]=t.value;var s=totSum();document.getElementById("tot-sum").textContent=s?s+" in total":"Type a number in each box that applies";document.getElementById("pcounter").textContent=peopleCounter();renderRail();return;}
  if(t.getAttribute("data-pp")){var q=t.getAttribute("data-pp").split("|");D.m.people[+q[0]][q[1]]=t.value;if(q[1]==="stage"||q[1]==="sector"){render(true);announce(q[1]==="sector"?"Two more fields appeared below.":"");}else{var hd=document.querySelector('[data-ph="'+q[0]+'"]');if(hd)hd.innerHTML=personHead(D.m.people[+q[0]],+q[0]).replace(/^Person ([A-Z])/,'<span class="num">Person $1</span>');document.getElementById("pcounter").textContent=peopleCounter();}renderRail();return;}
  if(t.id&&/^ev[tw]/.test(t.id)){if(!UI.evDraft)UI.evDraft={type:"",text:"",why:""};UI.evDraft[t.id.charAt(2)==="t"?"text":"why"]=t.value;return;}
});
document.addEventListener("change",function(e){var t=e.target;if(t.getAttribute("data-sc")){D.checks[t.getAttribute("data-sc")]=t.checked;}});
var lastCount={};
function liveCard(i){var c=D.contribs[i],n=cCount(c);var hd=document.querySelector('[data-ch="'+i+'"]');if(hd)hd.textContent=c.h?" · "+c.h:"";var cc=document.querySelector('[data-cc="'+i+'"]');if(cc){cc.textContent=n+" of 9 answered";var d=cc.parentNode.querySelectorAll(".dots i");d.forEach(function(x,j){x.classList.toggle("on",j<n);});}
  if(lastCount["c"+i]!=null&&lastCount["c"+i]!==n)announce(n+" of 9 answered");lastCount["c"+i]=n;
  var s=document.querySelector('[data-strip="'+i+'"]');if(s){var tmp=document.createElement("div");tmp.innerHTML=stripHTML(c,i,!!UI.ev[i]);s.replaceWith(tmp.firstChild);}}
function liveMentor(){var n=PF.filter(function(f){return !!D.m[f.k];}).length,m=document.querySelector("[data-mc]");if(m){m.textContent=n+" of 3 answered";m.parentNode.querySelectorAll(".dots i").forEach(function(x,j){x.classList.toggle("on",j<n);});}}
function livePs(){var pc=psCount(),m=document.querySelector("[data-psc]");if(m){m.textContent=pc[0]+" of "+pc[1]+" answered";m.parentNode.querySelectorAll(".dots i").forEach(function(x,j){x.classList.toggle("on",j<pc[0]);});}var s=document.getElementById("ps-strip");if(s){var tmp=document.createElement("div");tmp.innerHTML=psStrip();s.replaceWith(tmp.firstChild);}}

function focusQ(){var q=document.querySelectorAll(".qblock");var last=q[q.length-1];if(!last)return;var c=last.querySelector("input,button");if(c)c.focus({preventScroll:true});}
/* order: ↑ ↓ with a short slide (FLIP) */
function moveContrib(i,dir){var live=D.contribs.map(function(c,k){return k;}).filter(function(k){return cLive(D.contribs[k]);});var pos=live.indexOf(i),to=pos+dir;if(to<0||to>=live.length)return;
  var rects={};document.querySelectorAll("[data-oc]").forEach(function(n){rects[n.querySelector(".t").textContent]=n.getBoundingClientRect().top;});
  var a=live[pos],b=live[to],tmp=D.contribs[a];D.contribs[a]=D.contribs[b];D.contribs[b]=tmp;
  var comp=D.p.undecided||!D.p.comp?"":D.p.comp,lv=D.contribs.map(function(c,k){return [c,k];}).filter(function(x){return cLive(x[0]);});
  document.getElementById("order").innerHTML=orderHTML(lv,comp);
  var db=document.getElementById("draftbody");if(db)db.innerHTML=draftHTML().html;
  var ms=motionMs(260);
  document.querySelectorAll("[data-oc]").forEach(function(n){var key=n.querySelector(".t").textContent,old=rects[key];if(old==null)return;var dy=old-n.getBoundingClientRect().top;if(!dy||!ms)return;n.style.transition="none";n.style.transform="translateY("+dy+"px)";n.getBoundingClientRect();n.style.transition="";n.style.transform="";if(key===tmp.h)n.classList.add("moved");setTimeout(function(){n.classList.remove("moved");},600);});
  var moved=document.querySelector('[data-mv="'+b+'|'+dir+'"]')||document.querySelector('[data-mv="'+b+'|'+(-dir)+'"]');if(moved&&!moved.disabled)moved.focus();else{var alt=document.querySelector('[data-oc="'+b+'"] .mv .btn:not([disabled])');if(alt)alt.focus();}
  announce("“"+tmp.h+"” moved to position "+(to+1)+" of "+live.length+".");}

/* ═══ Mock-up controls ═══ */
function mb(label,on,attr){return '<button type="button" data-mock="'+attr+'" aria-pressed="'+!!on+'">'+label+'</button>';}
function renderMock(){
  document.getElementById("m-screens").innerHTML=SCREENS.map(function(s){return mb(s[1],SCREEN===s[0],"s:"+s[0]);}).join("");
  document.getElementById("m-states").innerHTML=(STATES[SCREEN]||[]).map(function(s){return mb(s[1],STATE===s[0],"st:"+s[0]);}).join("");
  document.getElementById("m-opts").innerHTML=(OPTS[SCREEN]||[]).map(function(o,i){return mb(o[0],o[1](),"o:"+i);}).join("")||'<span style="color:#777;width:auto;text-transform:none">none for this screen</span>';
  document.getElementById("m-rail").innerHTML=RAILS.map(function(r){return mb(r[1],SCREEN===r[2]&&STATE===r[3],"r:"+r[0]);}).join("");
  document.getElementById("m-width").innerHTML=mb("Desktop",W==="desktop","w:desktop")+mb("Phone 375",W==="phone","w:phone");
  var rm=document.body.classList.contains("rm");document.getElementById("m-motion").innerHTML=mb("Normal",!rm,"m:on")+mb("Reduced",rm,"m:off");
}
function mockClick(t){var v=t.getAttribute("data-mock"),k=v.split(":")[0],x=v.split(":")[1];
  if(v==="min"){var m=document.getElementById("mock");m.classList.toggle("is-min");t.textContent=m.classList.contains("is-min")?"Show controls":"Hide controls";return;}
  if(k==="s")go(x);if(k==="st")go(SCREEN,x);
  if(k==="o"){OPTS[SCREEN][+x][2]();render(true);}
  if(k==="r"){var r=RAILS.filter(function(z){return z[0]===x;})[0];go(r[2],r[3]);}
  if(k==="w"){W=x;render(true);}
  if(k==="m"){document.body.classList.toggle("rm",x==="off");renderMock();}
  writeHash();}
function writeHash(){try{history.replaceState(null,"","#s="+SCREEN+"&st="+STATE+"&w="+W+(document.body.classList.contains("clean")?"&clean=1":""));}catch(e){}}
function readHash(){var q={};location.hash.replace(/^#/,"").split("&").forEach(function(kv){var p=kv.split("=");if(p[0])q[p[0]]=decodeURIComponent(p[1]||"");});return q;}
var q=readHash();
if(q.clean)document.body.classList.add("clean");
if(q.w)W=q.w;
if(q.rm)document.body.classList.add("rm");
go(q.s&&STATES[q.s]?q.s:"start",q.st);
if(q.opt){q.opt.split(",").forEach(function(i){OPTS[SCREEN][+i][2]();});render();}
})();
</script>
