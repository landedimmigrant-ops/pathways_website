<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#912338"/>

  <!-- Subtle concentric circles -->
  <circle cx="900" cy="315" r="120" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none"/>
  <circle cx="900" cy="315" r="200" stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none"/>
  <circle cx="900" cy="315" r="280" stroke="rgba(255,255,255,0.03)" stroke-width="1" fill="none"/>
  <circle cx="900" cy="315" r="80" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Labels on circles -->
  <text x="900" y="310" text-anchor="middle" fill="white" font-size="16" font-weight="800" font-family="Inter,Segoe UI,sans-serif">RESEARCH</text>
  <text x="900" y="330" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Inter,Segoe UI,sans-serif">DISCOVERY</text>
  <text x="900" y="188" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="13" font-weight="700" font-family="Inter,Segoe UI,sans-serif">POLICY</text>
  <text x="900" y="450" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="13" font-weight="700" font-family="Inter,Segoe UI,sans-serif">TRAINING</text>
  <text x="1090" y="320" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-weight="800" font-family="Inter,Segoe UI,sans-serif">COMMUNITY</text>
  <text x="710" y="320" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14" font-weight="800" font-family="Inter,Segoe UI,sans-serif">INDUSTRY</text>

  <!-- Dots -->
  <circle cx="900" cy="195" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="900" cy="435" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="1095" cy="315" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="705" cy="315" r="3" fill="rgba(255,255,255,0.4)"/>

  <!-- Eyebrow -->
  <text x="80" y="180" fill="rgba(255,255,255,0.7)" font-size="16" font-weight="500" font-family="Inter,Segoe UI,sans-serif">Pathways to Impact · Concordia University</text>

  <!-- Headline -->
  <text x="80" y="260" fill="white" font-size="52" font-weight="700" font-family="Inter,Segoe UI,sans-serif">Research is</text>
  <text x="80" y="325" fill="white" font-size="52" font-weight="700" font-family="Inter,Segoe UI,sans-serif">where <tspan font-style="italic">change</tspan></text>
  <text x="80" y="390" fill="white" font-size="52" font-weight="700" font-family="Inter,Segoe UI,sans-serif">begins.</text>

  <!-- Body -->
  <text x="80" y="450" fill="rgba(255,255,255,0.75)" font-size="16" font-family="Inter,Segoe UI,sans-serif">Plan, evidence, and communicate your research impact.</text>
  <text x="80" y="475" fill="rgba(255,255,255,0.75)" font-size="16" font-family="Inter,Segoe UI,sans-serif">Office of Research · impact@concordia.ca</text>
</svg>
