<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V6 narrative CV tool — flow map</title>
<style>
  :root { --bg:#fbfaf8; --ink:#222; --muted:#666; --line:#d9d4cb; --accent:#912338; --panel:#fff; --note:#e0a800; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
  header { padding: 10px 16px 6px; border-bottom: 1px solid var(--line); background: #fff; }
  h1 { font-size: 17px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 6px 16px; border-bottom: 1px solid var(--line); background: #fff; }
  .row .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 2px; min-width: 62px; }
  button, input, select, textarea { font: inherit; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #bbb; background: #fff; border-radius: 999px; padding: 2px 10px 2px 8px; cursor: pointer; font-size: 12.5px; }
  .chip svg { width: 30px; height: 10px; flex: none; }
  .chip[aria-pressed="false"] { opacity: .45; background: #f1efeb; text-decoration: line-through; text-decoration-thickness: 1px; }
  .chip:focus-visible, .tab:focus-visible, .btn:focus-visible, .stepbtn:focus-visible { outline: 2px solid #1f5fbf; outline-offset: 2px; }
  .tab { border: 1px solid #bbb; background: #f6f4ef; border-radius: 6px 6px 0 0; padding: 3px 12px; cursor: pointer; font-size: 12.5px; }
  .tab[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn { border: 1px solid #aaa; background: #fff; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; }
  .btn:hover { background: #f1efeb; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #q { border: 1px solid #aaa; border-radius: 6px; padding: 3px 8px; width: 190px; font-size: 12.5px; }
  #qres { position: absolute; z-index: 20; background: #fff; border: 1px solid #aaa; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.15); max-width: 360px; display: none; }
  #qres button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
  #qres button:hover, #qres button:focus { background: #f1efeb; }
  .stepbtn { border: 1px solid #1f5fbf; color: #1f5fbf; background: #fff; border-radius: 50%; width: 26px; height: 26px; font-size: 12px; cursor: pointer; padding: 0; }
  .stepbtn[aria-current="step"] { background: #1f5fbf; color: #fff; }
  main { flex: 1; display: flex; min-height: 0; position: relative; }
  #stage { flex: 1; min-width: 0; position: relative; overflow: hidden; background: #fff; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  svg#map { width: 100%; height: 100%; display: block; user-select: none; }
  #panel { width: 400px; max-width: 60vw; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 12px 14px 40px; transition: width .15s; }
  #panel.wide { width: 760px; max-width: 75vw; }
  #panel h2 { font-size: 16px; margin: 0 0 2px; }
  #panel h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; }
  #panel .sum { font-weight: 600; margin: 4px 0 6px; }
  #panel code { background: #f1efeb; padding: 0 4px; border-radius: 3px; font-size: 12.5px; word-break: break-all; }
  #panel ul { margin: 0; padding-left: 18px; }
  #panel li { margin: 2px 0; }
  .tag { display: inline-block; font-size: 11px; border: 1px solid #999; border-radius: 4px; padding: 0 6px; margin-right: 4px; color: #444; }
  .qflag { background: #fdecea; border: 1px solid #c0392b; border-radius: 6px; padding: 6px 8px; margin: 8px 0; font-size: 13px; }
  .nbr, .steplink, .jump { background: none; border: 0; padding: 0; color: #1f5fbf; text-decoration: underline; cursor: pointer; font-size: inherit; text-align: left; }
  .etype { font-size: 11px; color: #555; }
  textarea.note { width: 100%; min-height: 84px; border: 1px solid #aaa; border-radius: 6px; padding: 6px 8px; resize: vertical; }
  .noteflag { font-size: 11.5px; color: #8a6a00; }
  .shots { display: flex; flex-wrap: wrap; gap: 8px; }
  .shotthumb { border: 1px solid #999; border-radius: 4px; padding: 2px; background: #fff; cursor: pointer; }
  .shotthumb img { display: block; max-width: 168px; max-height: 120px; object-fit: cover; object-position: top; }
  .shotthumb.phone img { max-width: 70px; max-height: 120px; }
  .shotthumb span { display: block; font-size: 11px; text-align: center; color: #555; }
  .viewer img { max-width: 100%; border: 1px solid #bbb; display: block; }
  .viewerbox { max-height: calc(100vh - 380px); min-height: 240px; overflow: auto; border: 1px solid #ccc; background: #f6f4ef; padding: 4px; }
  .demo { background: #fff8e1; border: 1px solid #f0c400; border-radius: 6px; padding: 5px 8px; font-size: 12.5px; margin: 6px 0; }
  .allnotes li { margin: 8px 0; }
  .allnotes q { color: #444; }
  #hint { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: #777; background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
  #zoombox { position: absolute; right: 10px; top: 8px; display: flex; gap: 4px; }
  .hide { display: none !important; }
  @media (max-width: 800px) { #panel { position: absolute; right: 0; top: 0; bottom: 0; width: 88vw; max-width: none; box-shadow: -4px 0 14px rgba(0,0,0,.2); } #panel.wide { width: 96vw; max-width: none; } }
  @media print { header, .row, #panel, #zoombox, #hint { display: none; } body { display: block; } }
</style>

<body>
<header>
  <h1>V6 narrative CV tool — flow map</h1>
  <p id="sub"></p>
</header>

<div class="row" id="presets" role="tablist" aria-label="Presets"><span class="lab">Presets</span></div>
<div class="row" id="layerchips"><span class="lab">Layers</span></div>
<div class="row" id="typechips"><span class="lab">Edges</span></div>
<div class="row" id="tools">
  <span class="lab">Tools</span>
  <input id="q" type="search" placeholder="Find a node…" aria-label="Find a node by name" autocomplete="off">
  <div id="qres" role="listbox"></div>
  <button class="btn" id="collapseAll">Collapse all</button>
  <button class="btn" id="expandAll">Expand all</button>
  <button class="btn" id="fit">Fit to window</button>
  <label style="font-size:12.5px"><input type="checkbox" id="edgeLabels"> Edge labels</label>
  <button class="btn" id="allNotes">All notes <span id="noteCount"></span></button>
  <button class="btn" id="generalNote">Map note</button>
</div>
<div class="row" id="steps"><span class="lab">Steps</span></div>

<main>
  <div id="stage">
    <svg id="map" role="img" aria-label="Flow map of the V6 narrative CV tool"></svg>
    <div id="zoombox"><button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">−</button></div>
    <div id="hint">Drag to pan · wheel or +/− to zoom · click a node for details</div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

function notesJson() { return { tool: "ncv-v6-flow-map", version: 1, exported: new Date().toISOString(), general: NOTES.general, items: NOTES.items }; }
function notesMarkdown() {
  const out = ["# V6 flow map — review notes", "", "Exported " + new Date().toISOString() + ". Each heading ends with the note's key in backticks so the file can be imported back.", ""];
  if (NOTES.general.trim()) out.push("## Whole map (`general`)", "", NOTES.general.trim(), "");
  Object.keys(NOTES.items).forEach(k => out.push("## " + labelForKey(k) + " (`" + k + "`)", "", NOTES.items[k].text.trim(), ""));
  return out.join("\n");
}
function importNotes(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => {
    let general = null, items = {};
    try {
      const text = String(r.result);
      if (/^\s*\{/.test(text)) { const j = JSON.parse(text); general = j.general || ""; items = j.items || {}; }
      else {
        let cur = null, buf = [];
        const flush = () => { if (cur) { const t = buf.join("\n").trim(); if (cur === "general") general = t; else if (t) items[cur] = { text: t, at: Date.now() }; } buf = []; };
        text.split(/\r?\n/).forEach(line => { const m = line.match(/^## .*\(`([^`]+)`\)\s*$/); if (m) { flush(); cur = m[1]; } else if (cur) buf.push(line); });
        flush();
      }
    } catch (e) { alert("That file could not be read as notes."); return; }
    const clash = Object.keys(items).filter(k => NOTES.items[k] && NOTES.items[k].text !== items[k].text).length + (general && NOTES.general && NOTES.general !== general ? 1 : 0);
    if (clash && !confirm(clash + " note(s) in the file differ from notes you already have. OK replaces them; Cancel keeps yours and adds only the new ones.")) {
      Object.keys(items).forEach(k => { if (NOTES.items[k]) delete items[k]; }); if (NOTES.general) general = null;
    }
    Object.keys(items).forEach(k => { NOTES.items[k] = { text: items[k].text || String(items[k]), at: items[k].at || Date.now() }; });
    if (general) NOTES.general = general;
    saveNotes(); renderPanel();
  };
  r.readAsText(file);
}
$("allNotes").addEventListener("click", () => { S.panelMode = "notes"; S.shot = null; renderPanel(); });
$("generalNote").addEventListener("click", () => { S.panelMode = "general"; S.shot = null; renderPanel(); });

/* ─────────────────────────── steps ─────────────────────────── */
function renderStepsBar() {
  const row = $("steps"); row.querySelectorAll(".stepbtn, .btn, .steptitle").forEach(x => x.remove());
  STEPS.forEach((s, i) => { const b = h("button", { class: "stepbtn", title: s.t, "aria-label": "Step " + (i + 1) + ": " + s.t, text: String(i + 1) }); if (i === S.step) b.setAttribute("aria-current", "step"); b.addEventListener("click", () => gotoStep(i)); row.appendChild(b); });
  const prev = h("button", { class: "btn", text: "← Prev" }); prev.addEventListener("click", () => gotoStep(Math.max(0, S.step - 1)));
  const next = h("button", { class: "btn", text: "Next →" }); next.addEventListener("click", () => gotoStep(Math.min(STEPS.length - 1, S.step + 1)));
  const clr = h("button", { class: "btn", text: "Clear" }); clr.addEventListener("click", () => { S.step = -1; renderStepsBar(); applyHighlight(); S.panelMode = S.selected ? "node" : "empty"; renderPanel(); });
  row.appendChild(prev); row.appendChild(next); row.appendChild(clr);
  row.appendChild(h("span", { class: "steptitle", style: "font-size:12.5px;color:#444", text: S.step >= 0 ? (S.step + 1) + ". " + STEPS[S.step].t : "The main user journey, step by step" }));
}
function gotoStep(i) {
  S.step = i; const st = STEPS[i];
  // show everything the step names
  const hidden = st.nodes.some(id => !layerVisible(id) || topCollapsedAncestor(id) !== id);
  if (hidden) { st.nodes.forEach(id => { let c = byId[id]; while (c && c.parent) { S.collapsed.delete(c.parent); c = byId[c.parent]; } }); PRESETS.find(p => p.id === "all"); S.preset = "all"; Object.keys(LAYERS).forEach(l => S.layerOn[l] = true); Object.keys(ETYPES).forEach(t => S.typeOn[t] = true); S.focus = null; syncChips(); }
  S.selected = null; S.panelMode = "step"; renderStepsBar(); redraw(); setTimeout(() => { const t = target[st.open]; if (t) centreOn(st.open); }, 30); renderPanel();
}
function renderStepPanel(p) {
  const st = STEPS[S.step];
  p.appendChild(h("h2", { text: "Step " + (S.step + 1) + " of " + STEPS.length + ": " + st.t })); p.appendChild(h("p", { text: st.text }));
  p.appendChild(h("h3", { text: "Nodes in this step" })); const ul = h("ul");
  st.nodes.forEach(id => { const li = h("li"); const b = h("button", { class: "steplink", text: byId[id].label }); b.addEventListener("click", () => { selectNode(id); }); li.appendChild(b); li.appendChild(h("span", { class: "etype", text: "  " + LAYERS[byId[id].layer].label })); ul.appendChild(li); });
  p.appendChild(ul);
}

/* ─────────────────────────── search ─────────────────────────── */
(function search() {
  const q = $("q"), res = $("qres");
  const place = () => { const r = q.getBoundingClientRect(); res.style.left = r.left + "px"; res.style.top = (r.bottom + 2) + "px"; };
  const show = () => {
    const v = q.value.trim().toLowerCase(); res.innerHTML = ""; if (!v) { res.style.display = "none"; return; }
    const hits = N.filter(n => (n.label + " " + n.id + " " + n.sum).toLowerCase().indexOf(v) !== -1).slice(0, 9);
    if (!hits.length) { res.appendChild(h("button", { text: "No node matches", disabled: "disabled" })); }
    hits.forEach(n => { const b = h("button", { text: n.label + "  ·  " + LAYERS[n.layer].label }); b.addEventListener("click", () => { selectNode(n.id); res.style.display = "none"; q.value = ""; }); res.appendChild(b); });
    place(); res.style.display = "block";
  };
  q.addEventListener("input", show);
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") { const first = res.querySelector("button:not([disabled])"); if (first) first.click(); } if (e.key === "Escape") { res.style.display = "none"; } });
  document.addEventListener("click", (e) => { if (!e.target.closest("#qres") && e.target !== q) res.style.display = "none"; });
})();

/* ─────────────────────────── boot ─────────────────────────── */
$("sub").textContent = "Built from " + META.file + " (commit " + META.commit + ", " + META.lines.toLocaleString("en-CA") + " lines). " + N.length + " nodes, " + E.length + " edges. Offline: no network needed.";
buildChips(); buildSvg(); renderStepsBar(); updateNoteCount();
window.__flowmap = { N, E, S, selectNode, applyPreset, gotoStep, openShot, noteKeys: () => noteKeys(), notesMarkdown, SHOTDATA: () => SHOTDATA };
applyPreset("all");
renderPanel();
applyView();
window.addEventListener("resize", () => {});
setTimeout(fit, 300);
})();
</script>
